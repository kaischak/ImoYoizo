<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0f">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Market Fluid</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:#0b0b0f;
    color:white;
    overflow: hidden;
    user-select: none;
}

/* Topbar ultra propre pour mobile */
.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(11, 11, 15, 0.9);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    z-index:100;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

#miniProfile{
    display:flex;
    flex-direction:column;
    justify-content:center;
    font-size:11px;
    font-weight: 600;
}
#pname { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
#money { color: #00ff99; font-weight: bold; }

.topbar-right{
    display:flex;
    gap:6px;
    align-items: center;
}
#addBtn{
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, #00ff99, #00ccff);
    font-size:16px;
    cursor:pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: black;
    font-weight: bold;
}
#addBtn:active { transform: scale(0.85) rotate(90deg); }

.topbar-right button:not(#addBtn){
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.topbar-right button:not(#addBtn):active { transform: scale(0.85); background: rgba(255,255,255,0.15); }

/* Barre de recherche positionnée EN DESSOUS de la topbar pour éviter les bugs de clic sur mobile */
.search-container {
    position: fixed;
    top: 50px;
    left: 0;
    right: 0;
    padding: 10px 12px;
    background: rgba(11, 11, 15, 0.95);
    backdrop-filter: blur(15px);
    z-index: 98;
    display: flex;
    gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.search-wrapper {
    position: relative;
    flex: 1;
}
#search{
    width: 100%;
    padding: 9px 12px 9px 34px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.06);
    color: white;
    outline: none;
    font-size: 13px;
    transition: all 0.2s;
}
#search:focus { background: rgba(255,255,255,0.12); border-color: rgba(0,255,153,0.4); }
.search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    opacity: 0.5;
    pointer-events: none;
}

.filter-toggle-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
}

/* Panneau filtres */
#filters{
    position: fixed;
    top: 105px;
    left: 0;
    right: 0;
    background: rgba(18, 18, 24, 0.98);
    backdrop-filter: blur(20px);
    padding: 12px 16px;
    z-index: 97;
    display: none;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideDown {
    from { transform: translateY(-10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.filter-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
}

.filter-input-box {
    position: relative;
    display: flex;
    align-items: center;
}
.filter-input-box span {
    position: absolute;
    left: 12px;
    font-size: 13px;
    pointer-events: none;
}
#filters input[type="number"] {
    width: 100%;
    background: rgba(255,255,255,0.06);
    color: white;
    border: 1px solid rgba(255,255,255,0.06);
    padding: 9px 12px 9px 30px;
    border-radius: 12px;
    font-size: 13px;
    outline: none;
}

.filter-chips {
    display: flex;
    gap: 8px;
}
.chip {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
.chip.active {
    background: rgba(0,255,153,0.15);
    border-color: rgba(0,255,153,0.4);
    color: #00ff99;
}

/* Feed & Cartes (Ajusté pour laisser la place à la barre de recherche en haut) */
#feed{
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    padding-top: 105px;
}

.post{
    height: 100vh;
    width: 100vw;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    padding-bottom: 20px;
}

.card{
    width: 100%;
    max-width: 420px;
    height: 78vh;
    background: #16161d;
    border-radius: 24px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
}

.card h2 {
    font-size: 16px;
    margin: 0 0 8px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card img{
    width: 100%;
    height: 48vh;
    object-fit: cover;
    border-radius: 16px;
    background: #000;
    cursor: pointer;
}

.info{
    font-size: 12px;
    opacity: 0.9;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.25);
    padding: 8px 12px;
    border-radius: 12px;
}

.card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    position: relative;
}

.card-actions button {
    padding: 10px;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
}

.buy-btn-wrapper { position: relative; display: flex; align-items: center; }
.buy-btn { background: #00ff99; color: black; width: 100%; }
.chat-btn-custom { background: #00ccff; color: black; }
.video-btn { background: rgba(255,255,255,0.1); color: white; }
.comment-btn { background: #2d6bff; color: white; }
.fav-btn { background: rgba(255, 215, 0, 0.2); color: gold; border: 1px solid rgba(255,215,0,0.3); }

.success-badge {
    position: absolute;
    right: -105px;
    background: linear-gradient(135deg, #00ff99, #00ccff);
    color: black;
    font-size: 11px;
    font-weight: bold;
    padding: 6px 10px;
    border-radius: 20px;
    opacity: 0;
    transform: translateX(-10px) scale(0.8);
    transition: all 0.3s ease;
    z-index: 10;
    white-space: nowrap;
}
.success-badge.show { opacity: 1; transform: translateX(0) scale(1); }

.likeBtn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: rgba(255,255,255,0.08);
    color: white;
    position: relative;
    margin: 0 auto;
}
.likeBtn.liked { background: rgba(255, 45, 85, 0.25); color: #ff2d55; }

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:1000;
}
.box{
    width:100%;
    max-width:500px;
    background:#16161d;
    padding:22px;
    border-radius:28px 28px 0 0;
    max-height:88vh;
    overflow-y:auto;
    border-top: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
}
input, textarea{
    width:100%;
    margin:6px 0;
    padding:12px;
    border-radius:12px;
    border:none;
    background: rgba(255,255,255,0.06);
    color: white;
    font-size: 14px;
    outline: none;
}
</style>
</head>

<body>

<!-- Topbar épurée -->
<div class="topbar">
    <div id="miniProfile">
        <strong id="pname">loading...</strong>
        <div id="money"></div>
    </div>

    <div class="topbar-right">
        <button id="addBtn" onclick="openSell()" title="Publier">+</button>
        <button onclick="openNotifications()" title="Notifications">🔔</button>
        <button onclick="openInv()" title="Inventaire">📦</button>
        <button onclick="location.href='friends.html'" title="Amis">👥</button>
        <button onclick="location.href='profile.html'" title="Profil">👤</button>
    </div>
</div>

<!-- Barre de recherche placée en dessous de la topbar -->
<div class="search-container">
    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input id="search" placeholder="Rechercher une annonce..." oninput="render()">
    </div>
    <button class="filter-toggle-btn" onclick="toggleFilters()" title="Filtres">⚙️</button>
</div>

<!-- Panneau des filtres -->
<div id="filters">
    <div class="filter-row">
        <div class="filter-input-box">
            <span>💰</span>
            <input id="minPrice" type="number" placeholder="Min" oninput="render()">
        </div>
        <div class="filter-input-box">
            <span>💰</span>
            <input id="maxPrice" type="number" placeholder="Max" oninput="render()">
        </div>
    </div>
    <div class="filter-chips">
        <div class="chip" id="chipVideo" onclick="toggleChip('videoOnly')">🎥 Vidéos</div>
        <div class="chip" id="chipPopular" onclick="toggleChip('popularOnly')">🔥 Populaires</div>
    </div>
</div>

<!-- Checkbox cachées pour la logique -->
<div style="display:none;">
    <input id="videoOnly" type="checkbox" onchange="render()">
    <input id="popularOnly" type="checkbox" onchange="render()">
</div>

<!-- Feed avec message de chargement instantané -->
<div id="feed">
    <div style="display:flex; height:70vh; align-items:center; justify-content:center; opacity:0.6; font-size:15px;">
        Chargement...
    </div>
</div>

<div id="modal" class="modal">
    <div class="box" id="box"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
let user = localStorage.getItem("user");

if(!user || user.startsWith("user")){
    localStorage.removeItem("user");
    window.location.href = "auth.html";
}

const supabaseUrl = "https://eezsocswqhqgkvghhygq.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlenNvY3N3cWhxZ2t2Z2hoeWdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjg5MjYsImV4cCI6MjA5NjY0NDkyNn0.TVI962lsUo67i6Ltq8okbOw-_GO-5yc4KDCyc8OkdVQ";
const client = supabase.createClient(supabaseUrl, supabaseKey);

let posts = [];
let usersCache = {};
let limit = 20;
let offset = 0;
let loading = false;
let allLoaded = false;

async function updateLastSeen(){
    await client.from("users").update({ last_seen: new Date() }).eq("username", user);
}

function getMoney(){
    return Number(localStorage.getItem("argent") || 0);
}

function setMoney(v){
    document.getElementById("money").innerText = "💰 " + v;
}

async function loadProfile(){
    document.getElementById("pname").innerText = "@" + user;
    setMoney(getMoney());
}

function toggleFilters(){
    let filters = document.getElementById("filters");
    filters.style.display = filters.style.display === "none" ? "block" : "none";
}

function toggleChip(type) {
    let checkboxId = type === 'videoOnly' ? 'videoOnly' : 'popularOnly';
    let chipId = type === 'videoOnly' ? 'chipVideo' : 'chipPopular';
    
    let checkbox = document.getElementById(checkboxId);
    let chip = document.getElementById(chipId);
    
    checkbox.checked = !checkbox.checked;
    if(checkbox.checked) {
        chip.classList.add('active');
    } else {
        chip.classList.remove('active');
    }
    if (navigator.vibrate) navigator.vibrate(20);
    render();
}

function openNotifications(){
    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">🔔 Notifications & Activité</h3>
        <div style="background:rgba(255,255,255,0.04); padding:12px; margin:8px 0; border-radius:12px; font-size:13px;">
            ✨ Bienvenue sur Market Fluid ! Tout est ultra fluide.
        </div>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:15px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer; font-weight:bold;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

async function loadPosts(reset = false){
    if(loading) return;
    loading = true;

    if(reset){
        offset = 0;
        allLoaded = false;
        posts = [];
    }

    try {
        let { data, error } = await client
            .from("posts")
            .select("id, name, price, image, videos, desc, user_id, likes, views")
            .order("id", { ascending: false })
            .range(offset, offset + limit - 1);

        if(error){
            console.error("Erreur Supabase:", error);
            document.getElementById("feed").innerHTML = `<div style='display:flex; height:70vh; align-items:center; justify-content:center; opacity:0.6; text-align:center; padding:20px;'>Erreur de chargement: ${error.message}</div>`;
            loading = false;
            return;
        }

        if(!data || data.length === 0){
            allLoaded = true;
            loading = false;
            if(posts.length === 0){
                document.getElementById("feed").innerHTML = "<div style='display:flex; height:70vh; align-items:center; justify-content:center; opacity:0.5;'>Aucune annonce trouvée</div>";
            }
            return;
        }

        posts = posts.concat(data);
        offset += limit;

        if(data.length < limit){
            allLoaded = true;
        }

        render();
    } catch(err) {
        console.error("Erreur réseau :", err);
        document.getElementById("feed").innerHTML = "<div style='display:flex; height:70vh; align-items:center; justify-content:center; opacity:0.5;'>Erreur de connexion</div>";
    } finally {
        loading = false;
    }
}

window.addEventListener("scroll", () => {
    let feed = document.getElementById("feed");
    if(feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 300){
        loadPosts();
    }
});

async function loadAvatar(post){
    if(usersCache[post.user_id] !== undefined){
        let img = usersCache[post.user_id]?.avatar || "";
        let el = document.getElementById(`avatar-${post.id}`);
        if(el) el.innerHTML = img ? `<img src="${img}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;">` : "👤";
        return;
    }

    let { data } = await client
        .from("users")
        .select("avatar")
        .eq("username", post.user_id)
        .maybeSingle();

    usersCache[post.user_id] = data || null;
    let img = data?.avatar || "";
    let el = document.getElementById(`avatar-${post.id}`);
    if(el){
        el.innerHTML = img ? `<img src="${img}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;">` : "👤";
    }
}

async function deletePost(id){
    if(!confirm("Supprimer cette annonce ?")) return;
    let { error } = await client.from("posts").delete().eq("id", id);
    if(error){ alert("Erreur suppression"); return; }
    loadPosts(true);
}

function openChat(username){
    if(!user) return;
    if(username === user){ alert("Tu ne peux pas chatter avec toi-même 😅"); return; }
    localStorage.setItem("chatWith", username);
    window.location.href = "chat.html";
}

function getLikedPosts(){ return JSON.parse(localStorage.getItem("likedPosts") || "[]"); }
function isLiked(id){ return getLikedPosts().includes(id); }

async function likePost(id, currentLikes, event){
    let btn = event.currentTarget;
    let liked = isLiked(id);
    let newLikes = liked ? currentLikes - 1 : currentLikes + 1;

    let { error } = await client.from("posts").update({ likes: newLikes }).eq("id", id);
    if(error) return;

    let likedList = getLikedPosts();
    if(liked){ likedList = likedList.filter(x => x !== id); } else { likedList.push(id); }
    localStorage.setItem("likedPosts", JSON.stringify(likedList));

    if (navigator.vibrate) navigator.vibrate(50);
    let targetPost = posts.find(p => p.id === id);
    if(targetPost) targetPost.likes = newLikes;
    
    let likesEl = document.getElementById(`likes-count-${id}`);
    if(likesEl) likesEl.innerText = newLikes;
    
    if(liked){ btn.classList.remove('liked'); } else { btn.classList.add('liked'); }
}

function scorePost(p){ return (p.likes || 0) * 3 + (p.views || 0) * 0.5; }

async function openInv() {
    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">📦 Mon Inventaire</h3>
        <div style="text-align:center; padding: 40px; opacity: 0.6;">Chargement...</div>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:15px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer; font-weight:bold;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";

    let { data } = await client
        .from("inventaire")
        .select("id, item, price, image")
        .eq("user_id", user)
        .order("id", { ascending: false });

    let items = data || [];

    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">📦 Mon Inventaire (${items.length})</h3>
        <div style="max-height: 50vh; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            ${items.length === 0 ? "<p style='opacity:0.6; text-align:center; grid-column: span 2;'>Ton inventaire est vide</p>" : ""}
            ${items.map(item => `
                <div style="background:rgba(255,255,255,0.04); padding:10px; border-radius:12px; text-align:center;">
                    <img src="${item.image}" loading="lazy" style="width:100%; height:90px; object-fit:cover; border-radius:8px; margin-bottom:6px;">
                    <b style="font-size:13px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.item}</b>
                    <span style="font-size:11px; color:#00ff99;">💰 ${item.price}</span>
                </div>
            `).join("")}
        </div>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:15px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer; font-weight:bold;">Fermer</button>
    `;
}

async function openComments(postId){
    let { data } = await client.from("comments").select("*").eq("post_id", postId).order("id", { ascending: false });
    let comments = data || [];

    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">💬 Commentaires</h3>
        <div style="max-height: 40vh; overflow-y: auto; margin-bottom: 10px;">
            ${comments.length === 0 ? "<p style='opacity:0.6; text-align:center;'>Aucun commentaire</p>" : ""}
            ${comments.map(c => `
                <div style="background:rgba(255,255,255,0.04); padding:10px; margin:6px 0; border-radius:10px;">
                    <b style="font-size:12px; color:#00ccff;">@${c.user_id}</b><br><span style="font-size:13px;">${c.text}</span>
                </div>
            `).join("")}
        </div>
        <textarea id="commentText" placeholder="Écris un commentaire..." style="height:70px; resize:none;"></textarea>
        <button onclick="addComment(${postId})" style="width:100%; padding:12px; margin-top:8px; background:#00ccff; border:none; border-radius:12px; font-weight:bold; cursor:pointer; color:black;">Envoyer</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:6px; padding:10px; border:none; border-radius:12px; background:transparent; opacity:0.7; color:white; cursor:pointer;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

async function addComment(postId){
    let text = document.getElementById("commentText").value.trim();
    if(!text) return;
    await client.from("comments").insert([{ post_id: postId, user_id: user, text: text }]);
    openComments(postId);
}

async function addView(postId){
    let post = posts.find(p => p.id === postId);
    if(!post) return;
    post.views = (post.views || 0) + 1;
    let viewsEl = document.getElementById(`views-count-${postId}`);
    if(viewsEl) viewsEl.innerText = post.views;
    await client.from("posts").update({ views: post.views }).eq("id", postId);
}

let viewObserver = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
        if(entry.isIntersecting){
            let postId = Number(entry.target.dataset.postId);
            let seenKey = `seen_post_${user}_${postId}`;
            if(!localStorage.getItem(seenKey)){
                localStorage.setItem(seenKey, "true");
                addView(postId);
            }
            observer.unobserve(entry.target);
        }
    });
}, { threshold: 0.6 });

function getFavorites(){ return JSON.parse(localStorage.getItem("favorites") || "[]"); }
function toggleFavorite(id, event){
    let favs = getFavorites();
    let isFav = favs.includes(id);
    if(isFav){ favs = favs.filter(x => x !== id); } else { favs.push(id); }
    localStorage.setItem("favorites", JSON.stringify(favs));
    let btn = event.currentTarget;
    if(btn) btn.innerText = !isFav ? "⭐ Favori" : "☆ Favori";
    if (navigator.vibrate) navigator.vibrate(20);
}

function vibrateSoft(btn){ if (navigator.vibrate) navigator.vibrate(15); }

async function render(){
    let s = document.getElementById("search").value.toLowerCase();
    let minPrice = Number(document.getElementById("minPrice")?.value || 0);
    let maxPrice = Number(document.getElementById("maxPrice")?.value || 99999999);
    let videoOnly = document.getElementById("videoOnly")?.checked;
    let popularOnly = document.getElementById("popularOnly")?.checked;

    let feed = document.getElementById("feed");
    feed.innerHTML = "";

    let filteredPosts = posts.filter(p => {
        let matchName = (p.name || "").toLowerCase().includes(s);
        let matchPrice = (p.price >= minPrice) && (p.price <= maxPrice);
        let matchVideo = !videoOnly || (p.videos && p.videos.length > 0);
        return matchName && matchPrice && matchVideo;
    });

    if(popularOnly){
        filteredPosts.sort((a,b) => scorePost(b) - scorePost(a));
    }

    if(filteredPosts.length === 0){
        feed.innerHTML = "<div style='display:flex; height:70vh; align-items:center; justify-content:center; opacity:0.5;'>Aucune annonce trouvée</div>";
        return;
    }

    let fragment = document.createDocumentFragment();

    for (let p of filteredPosts) {
        let div = document.createElement("div");
        div.className = "post";

        div.innerHTML = `
            <div class="card" data-post-id="${p.id}">
                <div>
                    <h2>${p.name}</h2>
                    <img src="${p.image}" loading="lazy" onclick="openPost(${p.id})" title="Agrandir">
                </div>

                <div class="info">
                    <div style="display:flex; align-items:center; gap:6px; cursor:pointer;" onclick="openUserMenu('${p.user_id}')">
                        <span id="avatar-${p.id}">👤</span>
                        <span style="color:#00ccff; font-weight:600;">@${p.user_id}</span>
                    </div>
                    <div>💰 <b>${p.price}</b></div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size:11px; opacity:0.6;">❤️ <span id="likes-count-${p.id}">${p.likes || 0}</span> · 👀 <span id="views-count-${p.id}">${p.views || 0}</span></div>
                    <button class="likeBtn ${isLiked(p.id) ? 'liked' : ''}" onclick="likePost(${p.id}, ${p.likes || 0}, event)">❤️</button>
                </div>

                <div class="card-actions">
                    <div class="buy-btn-wrapper">
                        <button class="buy-btn" onclick="vibrateSoft(this); openBuyModal(${p.id})">🛒 Acheter</button>
                        <div class="success-badge" id="badge-${p.id}">✨ Acheté !</div>
                    </div>
                    <button class="chat-btn-custom" onclick="openChat('${p.user_id}')">💬 Message</button>
                    ${p.videos && p.videos.length > 0 ? `<button class="video-btn" onclick="openVideos(${p.id})">🎥 Vidéos</button>` : `<button class="comment-btn" onclick="openComments(${p.id})">💬 Avis</button>`}
                    <button class="fav-btn" onclick="toggleFavorite(${p.id}, event)">${getFavorites().includes(p.id) ? "⭐ Favori" : "☆ Favori"}</button>
                </div>

                ${p.user_id === user ? `<button onclick="deletePost(${p.id})" style="background:rgba(255,0,0,0.15); color:#ff4d4d; border:none; border-radius:10px; padding:6px; font-size:12px; cursor:pointer;">Supprimer</button>` : ""}
            </div>
        `;
        fragment.appendChild(div);
        loadAvatar(p);
    }

    feed.appendChild(fragment);

    document.querySelectorAll('.card[data-post-id]').forEach(card => {
        viewObserver.observe(card);
    });
}

function openPost(id){
    let p = posts.find(x=>x.id===id);
    if(!p) return;
    document.getElementById("box").innerHTML = `
        <h2 style="margin-top:0;">${p.name}</h2>
        <img src="${p.image}" style="width:100%; height:260px; object-fit:cover; border-radius:16px; margin-bottom:10px;">
        <p style="opacity:0.9; font-size:14px; line-height:1.4;">📝 ${p.desc || "Aucune description."}</p>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
            <span style="font-weight:bold; color:#00ff99; font-size:16px;">💰 ${p.price}</span>
            <button onclick="openBuyModal(${p.id});" style="padding:10px 20px; background:#00ff99; color:black; border:none; border-radius:12px; font-weight:bold; cursor:pointer;">Acheter</button>
        </div>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:12px; padding:12px; border:none; border-radius:14px; background:rgba(255,255,255,0.08); color:white; cursor:pointer;">Fermer</button>
    `;
    document.getElementById("modal").style.display="flex";
}

function openBuyModal(id){
    let p = posts.find(x => x.id === id);
    if(!p) return;
    window.currentBuyQty = 1;

    document.getElementById("box").innerHTML = `
        <h2 style="margin-top:0;">🛍️ Confirmation d'achat</h2>
        <div style="display:flex; gap:12px; align-items:center; background:rgba(255,255,255,0.04); padding:10px; border-radius:14px; margin-bottom:12px;">
            <img src="${p.image}" style="width:65px; height:65px; object-fit:cover; border-radius:10px;">
            <div>
                <b style="font-size:15px;">${p.name}</b><br>
                <span style="font-size:13px; color:#00ff99;">💰 ${p.price}</span>
            </div>
        </div>
        
        <p style="font-size:13px; opacity:0.8; margin-bottom:4px;">Quantité :</p>
        <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:10px 14px; border-radius:14px; margin-bottom:12px;">
            <button onclick="updateQty(-1, ${p.price})" style="width:34px; height:34px; border-radius:10px; border:none; background:rgba(255,255,255,0.12); color:white; font-size:16px; font-weight:bold; cursor:pointer;">-</button>
            <span id="buyQtyDisplay" style="font-size:18px; font-weight:bold;">1</span>
            <button onclick="updateQty(1, ${p.price})" style="width:34px; height:34px; border-radius:10px; border:none; background:rgba(255,255,255,0.12); color:white; font-size:16px; font-weight:bold; cursor:pointer;">+</button>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin:15px 0; background:rgba(0,255,153,0.08); padding:12px; border-radius:12px;">
            <span>Total :</span>
            <span id="totalPriceDisplay" style="font-size:18px; font-weight:bold; color:#00ff99;">💰 ${p.price}</span>
        </div>

        <button onclick="confirmBuy(${p.id})" style="width:100%; padding:14px; border:none; border-radius:14px; font-weight:bold; background:#00ff99; color:black; cursor:pointer; font-size:15px;">Confirmer</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:8px; padding:10px; border:none; border-radius:12px; background:transparent; opacity:0.7; color:white; cursor:pointer;">Annuler</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

function updateQty(change, unitPrice){
    if(!window.currentBuyQty) window.currentBuyQty = 1;
    window.currentBuyQty += change;
    if(window.currentBuyQty < 1) window.currentBuyQty = 1;
    if(window.currentBuyQty > 99) window.currentBuyQty = 99;

    document.getElementById("buyQtyDisplay").innerText = window.currentBuyQty;
    document.getElementById("totalPriceDisplay").innerText = "💰 " + (window.currentBuyQty * unitPrice);
    if(navigator.vibrate) navigator.vibrate(10);
}

async function confirmBuy(id){
    let p = posts.find(x => x.id === id);
    if(!p) return;
    let qty = window.currentBuyQty || 1;
    let totalPrice = p.price * qty;
    let money = getMoney();

    if(money < totalPrice){ alert("Pas assez d'argent !"); return; }

    let insertData = [];
    for(let i = 0; i < qty; i++){
        insertData.push({ user_id: user, item: p.name, image: p.image, price: p.price });
    }

    await client.from("inventaire").insert(insertData);
    money -= totalPrice;
    localStorage.setItem("argent", money);
    setMoney(money);

    document.getElementById("modal").style.display = "none";
    let badge = document.getElementById(`badge-${id}`);
    if(badge){
        badge.innerText = `✨ x${qty} Acheté !`;
        badge.classList.add("show");
        setTimeout(() => badge.classList.remove("show"), 2000);
    }
    if(navigator.vibrate) navigator.vibrate([30, 40, 50]);
}

function openUserMenu(username){
    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">@${username}</h3>
        <button onclick="location.href='profile.html?user=${username}'" style="width:100%; padding:14px; margin-top:6px; border:none; border-radius:12px; background:rgba(255,255,255,0.08); color:white; cursor:pointer; font-weight:600;">👤 Profil</button>
        <button onclick="openChat('${username}')" style="width:100%; padding:14px; margin-top:6px; border:none; border-radius:12px; background:#00ccff; color:black; cursor:pointer; font-weight:600;">💬 Message</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:10px; padding:10px; border:none; border-radius:12px; background:transparent; opacity:0.7; color:white; cursor:pointer;">Fermer</button>
    `;
    document.getElementById("modal").style.display="flex";
}

function openVideos(id){
    let post = posts.find(p=>p.id===id);
    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">🎥 Vidéos</h3>
        ${(post.videos || []).map((v,i)=>`
            <div onclick="playVideo('${v}')" style="background:rgba(255,255,255,0.05); padding:14px; margin:8px 0; border-radius:12px; cursor:pointer; font-weight:bold;">
                <span>▶️ Vidéo ${i+1}</span>
            </div>
        `).join("")}
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:10px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

function playVideo(video){
    document.getElementById("box").innerHTML = `
        <video src="${video}" controls autoplay style="width:100%; border-radius:14px; max-height:70vh; background:black;"></video>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:10px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer;">Fermer</button>
    `;
}

function openSell(){
    document.getElementById("box").innerHTML = `
        <h2 style="margin-top:0;">🚀 Nouvelle Annonce</h2>
        <input id="name" placeholder="📦 Nom de l'objet">
        <textarea id="desc" placeholder="📝 Description..." style="height:80px; resize:none;"></textarea>
        <input id="price" type="number" placeholder="💰 Prix">
        
        <div id="dropZone" style="border:2px dashed #00ff99; border-radius:12px; padding:20px; text-align:center; cursor:pointer; margin:8px 0; background:rgba(0,255,153,.04);">
            <b>🖼️ Choisir une image</b>
            <input id="fileInput" type="file" accept="image/*" style="display:none;">
        </div>
        <img id="preview" style="display:none; width:100%; height:120px; object-fit:cover; border-radius:10px; margin-bottom:8px;">

        <div id="videoZone" style="border:2px dashed #00ccff; border-radius:12px; padding:15px; text-align:center; cursor:pointer; margin-bottom:8px; background:rgba(0,170,255,.04);">
            <b>🎥 Ajouter des vidéos (max 3)</b>
            <input id="videoInput" type="file" accept="video/*" multiple style="display:none;">
        </div>
        <div id="videoPreview"></div>

        <button onclick="create()" style="width:100%; padding:14px; border:none; border-radius:14px; font-weight:bold; background:linear-gradient(135deg,#00ff99,#00ccff); color:black; cursor:pointer; margin-top:6px;">Publier</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:6px; padding:10px; border:none; border-radius:12px; background:transparent; opacity:0.7; color:white; cursor:pointer;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";

    document.getElementById("dropZone").onclick = () => document.getElementById("fileInput").click();
    document.getElementById("fileInput").onchange = e => {
        if(e.target.files[0]){
            let reader = new FileReader();
            reader.onload = ev => {
                window.selectedImage = ev.target.result;
                let prev = document.getElementById("preview");
                prev.src = ev.target.result;
                prev.style.display = "block";
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    };

    document.getElementById("videoZone").onclick = () => document.getElementById("videoInput").click();
    document.getElementById("videoInput").onchange = e => {
        window.selectedVideos = Array.from(e.target.files).slice(0, 3);
        document.getElementById("videoPreview").innerHTML = `<p style="font-size:12px; color:#00ccff; text-align:center;">🎥 ${window.selectedVideos.length} vidéo(s) sélectionnée(s)</p>`;
    };
}

async function create(){
    let name = document.getElementById("name").value.trim();
    let desc = document.getElementById("desc").value.trim();
    let price = Number(document.getElementById("price").value);

    if(!name || !price || !window.selectedImage){
        alert("Remplis tous les champs et mets une image !");
        return;
    }

    let videoUrls = [];
    if(window.selectedVideos){
        for(let v of window.selectedVideos){ videoUrls.push(URL.createObjectURL(v)); }
    }

    let { error } = await client.from("posts").insert([{
        user_id: user, name: name, desc: desc, price: price,
        image: window.selectedImage, videos: videoUrls, likes: 0, views: 0
    }]);

    if(error){ alert("Erreur publication"); return; }

    window.selectedImage = null;
    window.selectedVideos = null;
    document.getElementById("modal").style.display = "none";
    loadPosts(true);
}

loadProfile();
updateLastSeen();
loadPosts(true);
</script>
