<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0f">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Market Fluid</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:#0b0b0f;
    color:white;
    overflow: hidden;
    user-select: none;
}

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:55px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 15px;
    background:rgba(11, 11, 15, 0.75);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    z-index:100;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

#miniProfile{
    display:flex;
    flex-direction:column;
    justify-content:center;
    font-size:11px;
    font-weight: 600;
}
#pname { color: #fff; }
#money { color: #00ff99; font-weight: bold; }

#search{
    width:35%;
    padding:8px 12px;
    border-radius:20px;
    border:none;
    background:rgba(255,255,255,0.1);
    color:white;
    outline:none;
    font-size: 13px;
    transition: background 0.2s;
}
#search:focus { background:rgba(255,255,255,0.18); }

.topbar-right{
    display:flex;
    gap:10px;
    align-items: center;
}
#addBtn{
    width:36px;
    height:36px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, #00ff99, #00ccff);
    font-size:18px;
    cursor:pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: black;
    font-weight: bold;
}

.topbar-right button:not(#addBtn){
    background: transparent;
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 5px;
}

#filters{
    position: fixed;
    top: 55px;
    left: 0;
    right: 0;
    background: rgba(22, 22, 29, 0.95);
    backdrop-filter: blur(15px);
    padding: 12px 15px;
    z-index: 99;
    display: none;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
#filters input {
    background: rgba(255,255,255,0.08);
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
}

#feed{
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    will-change: transform;
}

.post{
    height: 100vh;
    width: 100vw;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-top: 55px;
    box-sizing: border-box;
}

.card{
    width: 100%;
    max-width: 420px;
    height: 82vh;
    background: #16161d;
    border-radius: 24px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
}

.card h2 {
    font-size: 16px;
    margin: 0 0 8px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card img{
    width: 100%;
    height: 52vh;
    object-fit: cover;
    border-radius: 16px;
    background: #000;
}

.info{
    font-size: 12px;
    opacity: 0.9;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.25);
    padding: 8px 12px;
    border-radius: 12px;
}

.card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.card-actions button {
    padding: 10px;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s;
}
.card-actions button:active { transform: scale(0.96); }

.buy-btn { background: #00ff99; color: black; }
.chat-btn-custom { background: #00ccff; color: black; }
.video-btn { background: rgba(255,255,255,0.1); color: white; }
.comment-btn { background: #2d6bff; color: white; }
.fav-btn { background: rgba(255, 215, 0, 0.2); color: gold; border: 1px solid rgba(255,215,0,0.3); }

.likeBtn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    color: white;
    transition: transform 0.15s ease, background 0.2s ease;
    position: relative;
    overflow: hidden;
    margin: 0 auto;
}
.likeBtn.liked {
    background: rgba(255, 45, 85, 0.25);
    color: #ff2d55;
}
.likeBtn:active { transform: scale(0.8); }

.like-pop {
    position:absolute;
    font-size:16px;
    animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    pointer-events: none;
}
@keyframes pop {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity:1; }
    100% { transform: translate(-50%, -140%) scale(1.5); opacity:0; }
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:1000;
}

.box{
    width:100%;
    max-width:500px;
    background:#16161d;
    padding:20px;
    border-radius:24px 24px 0 0;
    max-height:85vh;
    overflow-y:auto;
    box-sizing:border-box;
    border-top: 1px solid rgba(255,255,255,0.1);
}

input, textarea{
    width:100%;
    margin:6px 0;
    padding:12px;
    border-radius:12px;
    border:none;
    background: rgba(255,255,255,0.06);
    color: white;
    font-size: 14px;
    outline: none;
}
input:focus, textarea:focus { background: rgba(255,255,255,0.12); }
</style>
</head>

<body>

<div class="topbar">
    <div id="miniProfile">
        <strong id="pname">loading...</strong>
        <div id="money"></div>
    </div>

    <input id="search" placeholder="Rechercher..." oninput="render()">

    <div class="topbar-right">
        <button id="addBtn" onclick="openSell()">+</button>
        <button onclick="openInv()">📦</button>
        <button onclick="location.href='friends.html'">👥</button>
        <button onclick="location.href='profile.html'">👤</button>
        <button onclick="toggleFilters()" title="Filtres">🔍</button>
    </div>
</div>

<div id="filters">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">
        <input id="minPrice" type="number" placeholder="💰 Min" oninput="render()">
        <input id="maxPrice" type="number" placeholder="💰 Max" oninput="render()">
    </div>
    <div style="display:flex; gap:15px; font-size:13px; opacity:0.9;">
        <label><input id="videoOnly" type="checkbox" onchange="render()"> 🎥 Vidéos</label>
        <label><input id="popularOnly" type="checkbox" onchange="render()"> 🔥 Populaires</label>
    </div>
</div>

<div id="feed"></div>

<div id="modal" class="modal">
    <div class="box" id="box"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
let user = localStorage.getItem("user");

if(!user || user.startsWith("user")){
    localStorage.removeItem("user");
    window.location.href = "auth.html";
}

const supabaseUrl = "https://eezsocswqhqgkvghhygq.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlenNvY3N3cWhxZ2t2Z2hoeWdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjg5MjYsImV4cCI6MjA5NjY0NDkyNn0.TVI962lsUo67i6Ltq8okbOw-_GO-5yc4KDCyc8OkdVQ";
const client = supabase.createClient(supabaseUrl, supabaseKey);

let posts = [];
let usersCache = {};
let limit = 5;
let offset = 0;
let loading = false;
let allLoaded = false;

async function updateLastSeen(){
    await client.from("users").update({ last_seen: new Date() }).eq("username", user);
}

function getMoney(){
    return Number(localStorage.getItem("argent") || 0);
}

function setMoney(v){
    document.getElementById("money").innerText = "💰 " + v;
}

async function loadProfile(){
    document.getElementById("pname").innerText = "@" + user;
    setMoney(getMoney());
}

function toggleFilters(){
    let filters = document.getElementById("filters");
    filters.style.display = filters.style.display === "none" ? "block" : "none";
}

async function loadPosts(reset = false){
    if(loading || allLoaded) return;
    loading = true;

    if(reset){
        offset = 0;
        allLoaded = false;
        posts = [];
        document.getElementById("feed").innerHTML = "";
    }

    let { data, error } = await client
        .from("posts")
        .select("id, name, price, image, videos, desc, user_id, likes, views")
        .order("id", { ascending: false })
        .range(offset, offset + limit - 1);

    if(error){
        console.error("Erreur chargement posts:", error);
        loading = false;
        return;
    }

    if(!data || data.length === 0){
        allLoaded = true;
        loading = false;
        return;
    }

    posts = posts.concat(data);
    offset += limit;

    render();
    loading = false;
}

window.addEventListener("scroll", () => {
    let feed = document.getElementById("feed");
    if(feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 300){
        loadPosts();
    }
});

async function loadAvatar(post){
    if(usersCache[post.user_id] !== undefined){
        let img = usersCache[post.user_id]?.avatar || "";
        let el = document.getElementById(`avatar-${post.id}`);
        if(el) el.innerHTML = img ? `<img src="${img}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;">` : "👤";
        return;
    }

    let { data } = await client
        .from("users")
        .select("avatar, last_seen")
        .eq("username", post.user_id)
        .maybeSingle();

    usersCache[post.user_id] = data || null;
    let img = data?.avatar || "";
    let el = document.getElementById(`avatar-${post.id}`);
    if(el){
        el.innerHTML = img ? `<img src="${img}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;">` : "👤";
    }
}

async function deletePost(id){
    if(!confirm("Supprimer cette annonce ?")) return;

    let { error } = await client.from("posts").delete().eq("id", id);
    if(error){
        alert("Erreur suppression");
        return;
    }
    loadPosts(true);
}

function openChat(username){
    if(!user) return;
    if(username === user){
        alert("Tu ne peux pas chatter avec toi-même 😅");
        return;
    }
    localStorage.setItem("chatWith", username);
    window.location.href = "chat.html";
}

function getLikedPosts(){
    return JSON.parse(localStorage.getItem("likedPosts") || "[]");
}

function isLiked(id){
    return getLikedPosts().includes(id);
}

function isOnline(lastSeen){
    if(!lastSeen) return false;
    return (Date.now() - new Date(lastSeen).getTime()) < 60000;
}

async function likePost(id, currentLikes, event){
    let btn = event.currentTarget;
    let liked = isLiked(id);
    let newLikes = liked ? currentLikes - 1 : currentLikes + 1;

    let { error } = await client.from("posts").update({ likes: newLikes }).eq("id", id);
    if(error) return;

    let likedList = getLikedPosts();
    if(liked){
        likedList = likedList.filter(x => x !== id);
    } else {
        likedList.push(id);
    }
    localStorage.setItem("likedPosts", JSON.stringify(likedList));

    if (navigator.vibrate) navigator.vibrate(50);

    let pop = document.createElement("div");
    pop.className = "like-pop";
    pop.innerHTML = "❤️";
    pop.style.left = "50%";
    pop.style.top = "50%";
    btn.appendChild(pop);
    setTimeout(()=>pop.remove(), 500);

    let targetPost = posts.find(p => p.id === id);
    if(targetPost) targetPost.likes = newLikes;
    render();
}

function scorePost(p){
    return (p.likes || 0) * 3 + (p.views || 0) * 0.5;
}

async function openComments(postId){
    let { data } = await client.from("comments").select("*").eq("post_id", postId).order("id", { ascending: false });
    let comments = data || [];

    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">💬 Commentaires</h3>
        <div style="max-height: 40vh; overflow-y: auto; margin-bottom: 10px;">
            ${comments.length === 0 ? "<p style='opacity:0.6; text-align:center;'>Aucun commentaire</p>" : ""}
            ${comments.map(c => `
                <div style="background:rgba(255,255,255,0.04); padding:10px; margin:6px 0; border-radius:10px;">
                    <b style="font-size:12px; color:#00ccff;">@${c.user_id}</b><br><span style="font-size:13px;">${c.text}</span>
                </div>
            `).join("")}
        </div>
        <textarea id="commentText" placeholder="Écris un commentaire..." style="height:70px; resize:none;"></textarea>
        <button onclick="addComment(${postId})" style="width:100%; padding:12px; margin-top:8px; background:#00ccff; border:none; border-radius:12px; font-weight:bold; cursor:pointer; color:black;">Envoyer</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:6px; padding:10px; border:none; border-radius:12px; background:transparent; opacity:0.7; cursor:pointer; color:white;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

async function addComment(postId){
    let text = document.getElementById("commentText").value.trim();
    if(!text) return;
    await client.from("comments").insert([{ post_id: postId, user_id: user, text: text }]);
    openComments(postId);
}

// SYSTÈME DE VUES OPTIMISÉ ET FIABLE
async function addView(postId){
    let post = posts.find(p => p.id === postId);
    if(!post) return;

    // Incrémente immédiatement dans l'objet local et met à jour le texte à l'écran sans re-rendre tout le feed
    post.views = (post.views || 0) + 1;
    let viewsEl = document.getElementById(`views-count-${postId}`);
    if(viewsEl) viewsEl.innerText = post.views;

    // Enregistre en base de données de manière asynchrone
    await client.from("posts").update({ views: post.views }).eq("id", postId);
}

// IntersectionObserver pour déclencher la vue dès que la carte apparaît à l'écran
let viewObserver = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
        if(entry.isIntersecting){
            let postId = Number(entry.target.dataset.postId);
            let seenKey = `seen_post_${user}_${postId}`;
            
            // Compte une seule vue par utilisateur et par post dans cette session/appareil
            if(!localStorage.getItem(seenKey)){
                localStorage.setItem(seenKey, "true");
                addView(postId);
            }
            observer.unobserve(entry.target);
        }
    });
}, { threshold: 0.6 }); // Déclenche quand 60% de la carte est visible

function getFavorites(){
    return JSON.parse(localStorage.getItem("favorites") || "[]");
}

function toggleFavorite(id){
    let favs = getFavorites();
    if(favs.includes(id)){
        favs = favs.filter(x => x !== id);
    } else {
        favs.push(id);
    }
    localStorage.setItem("favorites", JSON.stringify(favs));
    render();
}

function vibrateSoft(btn){
    if (navigator.vibrate) navigator.vibrate(15);
    if (btn) {
        btn.style.transform = "scale(0.96)";
        setTimeout(() => btn.style.transform = "", 100);
    }
}

async function render(){
    let s = document.getElementById("search").value.toLowerCase();
    let minPrice = Number(document.getElementById("minPrice")?.value || 0);
    let maxPrice = Number(document.getElementById("maxPrice")?.value || 99999999);
    let videoOnly = document.getElementById("videoOnly")?.checked;
    let popularOnly = document.getElementById("popularOnly")?.checked;

    let feed = document.getElementById("feed");
    feed.innerHTML = "";

    let filteredPosts = posts.filter(p => {
        let matchName = (p.name || "").toLowerCase().includes(s);
        let matchPrice = (p.price >= minPrice) && (p.price <= maxPrice);
        let matchVideo = !videoOnly || (p.videos && p.videos.length > 0);
        return matchName && matchPrice && matchVideo;
    });

    if(popularOnly){
        filteredPosts.sort((a,b) => scorePost(b) - scorePost(a));
    }

    if(filteredPosts.length === 0){
        feed.innerHTML = "<div style='display:flex; height:100vh; align-items:center; justify-content:center; opacity:0.5;'>Aucune annonce trouvée</div>";
        return;
    }

    let fragment = document.createDocumentFragment();

    for (let p of filteredPosts) {
        let div = document.createElement("div");
        div.className = "post";

        div.innerHTML = `
            <div class="card" data-post-id="${p.id}" onclick="openPost(${p.id})">
                <div>
                    <h2>${p.name}</h2>
                    <img src="${p.image}">
                </div>

                <div class="info">
                    <div style="display:flex; align-items:center; gap:6px; cursor:pointer;" onclick="event.stopPropagation(); openUserMenu('${p.user_id}')">
                        <span id="avatar-${p.id}">👤</span>
                        <span style="color:#00ccff; font-weight:600;">@${p.user_id}</span>
                        <span id="status-${p.user_id}"></span>
                    </div>
                    <div>💰 <b>${p.price}</b></div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size:11px; opacity:0.6;">❤️ ${p.likes || 0} · 👀 <span id="views-count-${p.id}">${p.views || 0}</span> vues</div>
                    <button class="likeBtn ${isLiked(p.id) ? 'liked' : ''}" onclick="event.stopPropagation(); likePost(${p.id}, ${p.likes || 0}, event)">❤️</button>
                </div>

                <div class="card-actions">
                    <button class="buy-btn" onclick="event.stopPropagation(); vibrateSoft(); buy(${p.id}, event)">🛒 Acheter</button>
                    <button class="chat-btn-custom" onclick="event.stopPropagation(); openChat('${p.user_id}')">💬 Message</button>
                    ${p.videos && p.videos.length > 0 ? `<button class="video-btn" onclick="event.stopPropagation(); openVideos(${p.id})">🎥 Vidéos</button>` : `<button class="comment-btn" onclick="event.stopPropagation(); openComments(${p.id})">💬 Avis</button>`}
                    <button class="fav-btn" onclick="event.stopPropagation(); toggleFavorite(${p.id})">${getFavorites().includes(p.id) ? "⭐ Favori" : "☆ Favori"}</button>
                </div>

                ${p.user_id === user ? `<button onclick="event.stopPropagation(); deletePost(${p.id})" style="background:rgba(255,0,0,0.15); color:#ff4d4d; border:none; border-radius:10px; padding:6px; font-size:12px; cursor:pointer;">Supprimer l'annonce</button>` : ""}
            </div>
        `;
        fragment.appendChild(div);
        loadAvatar(p);
    }

    feed.appendChild(fragment);

    // Attache l'observateur sur les nouvelles cartes affichées pour compter les vues au scroll
    document.querySelectorAll('.card[data-post-id]').forEach(card => {
        viewObserver.observe(card);
    });
}

function openPost(id){
    let p = posts.find(x=>x.id===id);
    if(!p) return;
    document.getElementById("box").innerHTML = `
        <h2 style="margin-top:0;">${p.name}</h2>
        <img src="${p.image}" style="width:100%; height:250px; object-fit:cover; border-radius:14px; margin-bottom:10px;">
        <p style="opacity:0.9; font-size:14px;">📝 ${p.desc || "Aucune description"}</p>
        <p style="font-weight:bold; color:#00ff99;">💰 ${p.price}</p>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:15px; padding:12px; border:none; border-radius:14px; background:rgba(255,255,255,0.1); color:white; cursor:pointer; font-weight:bold;">Fermer</button>
    `;
    document.getElementById("modal").style.display="flex";
}

function openUserMenu(username){
    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">@${username}</h3>
        <button onclick="location.href='profile.html?user=${username}'" style="width:100%; padding:14px; margin-top:6px; border:none; border-radius:12px; background:rgba(255,255,255,0.08); color:white; cursor:pointer; font-weight:600;">👤 Voir le profil</button>
        <button onclick="openChat('${username}')" style="width:100%; padding:14px; margin-top:6px; border:none; border-radius:12px; background:#00ccff; color:black; cursor:pointer; font-weight:600;">💬 Envoyer un message</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:10px; padding:10px; border:none; border-radius:12px; background:transparent; opacity:0.7; color:white; cursor:pointer;">Fermer</button>
    `;
    document.getElementById("modal").style.display="flex";
}

function openVideos(id){
    let post = posts.find(p=>p.id===id);
    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">🎥 Vidéos de l'annonce</h3>
        ${(post.videos || []).map((v,i)=>`
            <div onclick="playVideo('${v}')" style="background:rgba(255,255,255,0.05); padding:14px; margin:8px 0; border-radius:12px; cursor:pointer; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">
                <span>▶️ Regarder la vidéo ${i+1}</span>
            </div>
        `).join("")}
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:10px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

function playVideo(video){
    document.getElementById("box").innerHTML = `
        <video src="${video}" controls autoplay style="width:100%; border-radius:14px; max-height:70vh; background:black;"></video>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:10px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer;">Fermer</button>
    `;
}

async function buy(id, event){
    let btn = event?.currentTarget;
    let { data, error } = await client.from("posts").select("*").eq("id", id).single();
    if(error) return;

    let money = Number(localStorage.getItem("argent") || 0);
    let price = Number(data.price);

    if(money < price){
        alert("Pas assez d'argent !");
        return;
    }

    await client.from("inventaire").insert([{
        user_id: user,
        item: data.name,
        image: data.image,
        price: data.price
    }]);

    money -= price;
    localStorage.setItem("argent", money);
    setMoney(money);

    if(btn){
        btn.innerText = "✔ Acheté";
        btn.style.background = "#00ff99";
        setTimeout(()=>btn.innerText = "🛒 Acheter", 1200);
    }
    if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
}

function openSell(){
    document.getElementById("box").innerHTML = `
        <h2 style="margin-top:0;">🚀 Nouvelle Annonce</h2>
        <input id="name" placeholder="📦 Nom de l'objet">
        <textarea id="desc" placeholder="📝 Description..." style="height:80px; resize:none;"></textarea>
        <input id="price" type="number" placeholder="💰 Prix">
        
        <div id="dropZone" style="border:2px dashed #00ff99; border-radius:12px; padding:20px; text-align:center; cursor:pointer; margin:8px 0; background:rgba(0,255,153,.04);">
            <b>🖼️ Choisir une image</b>
            <input id="fileInput" type="file" accept="image/*" style="display:none;">
        </div>
        <img id="preview" style="display:none; width:100%; height:120px; object-fit:cover; border-radius:10px; margin-bottom:8px;">

        <div id="videoZone" style="border:2px dashed #00ccff; border-radius:12px; padding:15px; text-align:center; cursor:pointer; margin-bottom:8px; background:rgba(0,170,255,.04);">
            <b>🎥 Ajouter des vidéos (max 3)</b>
            <input id="videoInput" type="file" accept="video/*" multiple style="display:none;">
        </div>
        <div id="videoPreview"></div>

        <button onclick="create()" style="width:100%; padding:14px; border:none; border-radius:14px; font-weight:bold; background:linear-gradient(135deg,#00ff99,#00ccff); color:black; cursor:pointer; margin-top:6px;">Publier</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:6px; padding:10px; border:none; border-radius:12px; background:transparent; opacity:0.7; color:white; cursor:pointer;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";

    document.getElementById("dropZone").onclick = () => document.getElementById("fileInput").click();
    document.getElementById("fileInput").onchange = e => {
        if(e.target.files[0]){
            let reader = new FileReader();
            reader.onload = ev => {
                window.selectedImage = ev.target.result;
                let prev = document.getElementById("preview");
                prev.src = ev.target.result;
                prev.style.display = "block";
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    };

    window.selectedImage = "";
    window.selectedVideos = [];

    document.getElementById("videoZone").onclick = () => document.getElementById("videoInput").click();
    document.getElementById("videoInput").onchange = e => {
        let files = [...e.target.files];
        if(files.length > 3){ alert("Maximum 3 vidéos"); return; }
        window.selectedVideos = [];
        let html = "";
        files.forEach(file => {
            let reader = new FileReader();
            reader.onload = ev => {
                window.selectedVideos.push(ev.target.result);
                html += `<div style="font-size:11px; opacity:0.8; margin-top:2px;">📹 Vidéo ajoutée</div>`;
                document.getElementById("videoPreview").innerHTML = html;
            };
            reader.readAsDataURL(file);
        });
    };
}

async function create(){
    let name = document.getElementById("name").value.trim();
    let desc = document.getElementById("desc").value.trim();
    let price = Number(document.getElementById("price").value);

    if(!name || !price){ alert("Nom et prix obligatoires !"); return; }

    let { error } = await client.from("posts").insert([{
        name: name,
        image: window.selectedImage || "",
        videos: window.selectedVideos || [],
        price: price,
        desc: desc,
        user_id: user,
        likes: 0,
        views: 0
    }]);

    if(error){ alert(error.message); return; }

    document.getElementById("modal").style.display = "none";
    loadPosts(true);
}

async function openInv(){
    let { data } = await client.from("inventaire").select("*").eq("user_id", user);
    let items = data || [];

    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">📦 Mon Inventaire</h3>
        <div style="max-height:50vh; overflow-y:auto;">
            ${items.length === 0 ? "<p style='opacity:0.6; text-align:center;'>Aucun objet</p>" : ""}
            ${items.map(i => `
                <div style="background:rgba(255,255,255,0.04); padding:10px; margin:8px 0; border-radius:12px; display:flex; align-items:center; gap:10px;">
                    <img src="${i.image}" style="width:45px; height:45px; border-radius:8px; object-fit:cover;">
                    <div style="flex:1;"><b>${i.item}</b><br><span style="font-size:12px; color:#00ff99;">💰 ${i.price}</span></div>
                    <button onclick="giveItem('${i.id}')" style="background:#00ff99; border:none; border-radius:10px; padding:8px 12px; font-weight:bold; cursor:pointer; color:black;">🎁</button>
                </div>
            `).join("")}
        </div>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; padding:12px; margin-top:10px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

async function giveItem(itemId){
    let { data: friends } = await client.from("friends").select("*").eq("status","accepted").or(`user1.eq.${user},user2.eq.${user}`);
    let html = `<h3 style="margin-top:0;">🎁 Choisir un ami</h3>`;
    if(!friends || friends.length === 0){
        html += "<p style='opacity:0.6; text-align:center;'>Aucun ami disponible</p>";
    } else {
        friends.forEach(f => {
            let friend = f.user1 === user ? f.user2 : f.user1;
            html += `<button style="width:100%; padding:12px; margin:6px 0; border:none; border-radius:10px; background:rgba(255,255,255,0.08); color:white; font-weight:bold; cursor:pointer;" onclick="sendItem(${itemId}, '${friend}')">@${friend}</button>`;
        });
    }
    html += `<button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:10px; padding:10px; border-radius:10px; background:transparent; color:white; opacity:0.7; cursor:pointer;">Fermer</button>`;
    document.getElementById("box").innerHTML = html;
}

async function sendItem(itemId, friend){
    let { data:item } = await client.from("inventaire").select("*").eq("id", itemId).single();
    if(!item) return;

    await client.from("inventaire").insert([{ user_id: friend, item: item.item, image: item.image, price: item.price }]);
    await client.from("inventaire").delete().eq("id", itemId);

    if(navigator.vibrate) navigator.vibrate([40,50,40]);
    document.getElementById("modal").style.display = "none";
    openInv();
}

const modal = document.getElementById("modal");
const box = document.getElementById("box");

modal.addEventListener("click", () => { modal.style.display = "none"; });
box.addEventListener("click", (e) => { e.stopPropagation(); });

client.channel('posts-channel').on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => {
    loadPosts(true);
}).subscribe();

loadPosts(true);
loadProfile();
setInterval(updateLastSeen, 30000);
updateLastSeen();
</script>
