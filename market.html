<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0f">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Market Fluid</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:#0b0b0f;
    color:white;
    overflow: hidden;
    user-select: none;
}

/* Zone de drop customisée ultra stylée */
.custom-drop-zone {
    border: 2px dashed rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.03);
    border-radius: 18px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
}
.custom-drop-zone:hover {
    border-color: rgba(0, 255, 153, 0.5);
    background: rgba(0, 255, 153, 0.04);
}
.custom-drop-zone.dragover {
    border-color: #00ff99;
    background: rgba(0, 255, 153, 0.1);
    transform: scale(1.01);
}

/* Topbar ultra propre pour mobile */
.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(11, 11, 15, 0.9);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    z-index:100;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

#miniProfile{
    display:flex;
    flex-direction:column;
    justify-content:center;
    font-size:11px;
    font-weight: 600;
}
#pname { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
#money { color: #00ff99; font-weight: bold; }

.topbar-right{
    display:flex;
    gap:6px;
    align-items: center;
}
#addBtn{
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, #00ff99, #00ccff);
    font-size:16px;
    cursor:pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: black;
    font-weight: bold;
}
#addBtn:active { transform: scale(0.85) rotate(90deg); }

.topbar-right button:not(#addBtn){
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.topbar-right button:not(#addBtn):active { transform: scale(0.85); background: rgba(255,255,255,0.15); }

/* Barre de recherche positionnée EN DESSOUS de la topbar */
.search-container {
    position: fixed;
    top: 50px;
    left: 0;
    right: 0;
    padding: 10px 12px;
    background: rgba(11, 11, 15, 0.95);
    backdrop-filter: blur(15px);
    z-index: 98;
    display: flex;
    gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.search-wrapper {
    position: relative;
    flex: 1;
}
#search{
    width: 100%;
    padding: 9px 12px 9px 34px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.06);
    color: white;
    outline: none;
    font-size: 13px;
    transition: all 0.2s;
}
#search:focus { background: rgba(255,255,255,0.12); border-color: rgba(0,255,153,0.4); }
.search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    opacity: 0.5;
    pointer-events: none;
}

.filter-toggle-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
}

/* Panneau filtres */
#filters{
    position: fixed;
    top: 105px;
    left: 0;
    right: 0;
    background: rgba(18, 18, 24, 0.98);
    backdrop-filter: blur(20px);
    padding: 12px 16px;
    z-index: 97;
    display: none;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.filter-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
}

.filter-input-box {
    position: relative;
    display: flex;
    align-items: center;
}
.filter-input-box span {
    position: absolute;
    left: 12px;
    font-size: 13px;
    pointer-events: none;
}
#filters input[type="number"] {
    width: 100%;
    background: rgba(255,255,255,0.06);
    color: white;
    border: 1px solid rgba(255,255,255,0.06);
    padding: 9px 12px 9px 30px;
    border-radius: 12px;
    font-size: 13px;
    outline: none;
}

.filter-chips {
    display: flex;
    gap: 8px;
}
.chip {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
.chip.active {
    background: rgba(0,255,153,0.15);
    border-color: rgba(0,255,153,0.4);
    color: #00ff99;
}

/* Feed & Cartes - Ajustés pour que rien ne soit caché sous la barre de recherche */
#feed{
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    padding-top: 110px; 
}

.post{
    height: 100vh;
    width: 100vw;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    box-sizing: border-box;
    padding-bottom: 25px;
}

.card{
    width: 100%;
    max-width: 420px;
    height: 77vh;
    background: #16161d;
    border-radius: 24px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.06);
}

.card-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.card h2 {
    font-size: 15px;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
}

.card img{
    width: 100%;
    height: 38vh;
    object-fit: cover;
    border-radius: 16px;
    background: #000;
    cursor: pointer;
    margin-top: 6px;
}

.info{
    font-size: 12px;
    opacity: 0.9;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.25);
    padding: 7px 12px;
    border-radius: 12px;
}

/* Style cliquable pour l'auteur du post */
.post-author {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    transition: background 0.2s;
}
.post-author:hover {
    background: rgba(255,255,255,0.08);
}

/* Bouton 3 petits points */
.options-btn {
    background: rgba(255,255,255,0.05);
    border: none;
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: background 0.2s;
}
.options-btn:hover {
    background: rgba(255,255,255,0.12);
}

.card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    position: relative;
}

.card-actions button {
    padding: 9px;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
}

.buy-btn-wrapper { position: relative; display: flex; align-items: center; }
.buy-btn { background: #00ff99; color: black; width: 100%; }
.chat-btn-custom { background: #00ccff; color: black; }
.video-btn { background: rgba(255,255,255,0.1); color: white; }
.comment-btn { background: rgba(255,255,255,0.08); color: white; }
.fav-btn { background: rgba(255, 215, 0, 0.2); color: gold; border: 1px solid rgba(255,215,0,0.3); }

.success-badge {
    position: absolute;
    right: -105px;
    background: linear-gradient(135deg, #00ff99, #00ccff);
    color: black;
    font-size: 11px;
    font-weight: bold;
    padding: 6px 10px;
    border-radius: 20px;
    opacity: 0;
    transform: translateX(-10px) scale(0.8);
    transition: all 0.3s ease;
    z-index: 10;
    white-space: nowrap;
}
.success-badge.show { opacity: 1; transform: translateX(0) scale(1); }

.likeBtn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    background: rgba(255,255,255,0.08);
    color: white;
}
.likeBtn.liked { background: rgba(255, 45, 85, 0.25); color: #ff2d55; }

/* Modal stylé */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:1000;
}
.box{
    width:100%;
    max-width:500px;
    background:#16161d;
    padding:22px;
    border-radius:28px 28px 0 0;
    max-height:88vh;
    overflow-y:auto;
    border-top: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
}

/* Inputs de formulaire modernes et élégants */
input, textarea{
    width:100%;
    margin:6px 0 12px 0;
    padding:13px 14px;
    border-radius:14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05);
    color: white;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
}
input:focus, textarea:focus {
    border-color: rgba(0,255,153,0.5);
    background: rgba(255,255,255,0.08);
}
</style>
</head>

<body>

<!-- Topbar épurée -->
<div class="topbar">
    <div id="miniProfile">
        <strong id="pname">loading...</strong>
        <div id="money"></div>
    </div>

    <div class="topbar-right">
        <button id="addBtn" onclick="openSell()" title="Publier">+</button>
        <button onclick="openNotifications()" title="Notifications">🔔</button>
        <button onclick="openInv()" title="Inventaire">📦</button>
        <button onclick="location.href='friends.html'" title="Amis">👥</button>
        <button onclick="location.href='profile.html'" title="Profil">👤</button>
    </div>
</div>

<!-- Barre de recherche -->
<div class="search-container">
    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input id="search" placeholder="Rechercher une annonce..." oninput="render()">
    </div>
    <button class="filter-toggle-btn" onclick="toggleFilters()" title="Filtres">⚙️</button>
</div>

<!-- Panneau des filtres -->
<div id="filters">
    <div class="filter-row">
        <div class="filter-input-box">
            <span>💰</span>
            <input id="minPrice" type="number" placeholder="Min" oninput="render()">
        </div>
        <div class="filter-input-box">
            <span>💰</span>
            <input id="maxPrice" type="number" placeholder="Max" oninput="render()">
        </div>
    </div>
    <div class="filter-chips">
        <div class="chip" id="chipVideo" onclick="toggleChip('videoOnly')">🎥 Vidéos</div>
        <div class="chip" id="chipPopular" onclick="toggleChip('popularOnly')">🔥 Populaires</div>
    </div>
</div>

<div style="display:none;">
    <input id="videoOnly" type="checkbox" onchange="render()">
    <input id="popularOnly" type="checkbox" onchange="render()">
</div>

<!-- Feed -->
<div id="feed">
    <div style="display:flex; height:70vh; align-items:center; justify-content:center; opacity:0.6; font-size:15px;">
        Chargement...
    </div>
</div>

<div id="modal" class="modal" onclick="if(event.target === this) this.style.display='none'">
    <div class="box" id="box"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
let user = localStorage.getItem("user");

if(!user || user.startsWith("user")){
    localStorage.removeItem("user");
    window.location.href = "auth.html";
}

const supabaseUrl = "https://eezsocswqhqgkvghhygq.supabase.co";
const cleanKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlenNvY3N3cWhxZ2t2Z2hoeWdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjg5MjYsImV4cCI6MjA5NjY0NDkyNn0.TVI962lsUo67i6Ltq8okbOw-_GO-5yc4KDCyc8OkdVQ";
const client = supabase.createClient(supabaseUrl, cleanKey);

let posts = [];
let usersCache = {};
let loading = false;

function getMoney(){
    return Number(localStorage.getItem("argent") || 0);
}

function setMoney(v){
    document.getElementById("money").innerText = "💰 " + v;
}

async function loadProfile(){
    document.getElementById("pname").innerText = "@" + user;
    setMoney(getMoney());
}

function toggleFilters(){
    let filters = document.getElementById("filters");
    filters.style.display = filters.style.display === "none" ? "block" : "none";
}

function toggleChip(type) {
    let checkboxId = type === 'videoOnly' ? 'videoOnly' : 'popularOnly';
    let chipId = type === 'videoOnly' ? 'chipVideo' : 'chipPopular';
    
    let checkbox = document.getElementById(checkboxId);
    let chip = document.getElementById(chipId);
    
    checkbox.checked = !checkbox.checked;
    if(checkbox.checked) {
        chip.classList.add('active');
    } else {
        chip.classList.remove('active');
    }
    if (navigator.vibrate) navigator.vibrate(20);
    render();
}

function openNotifications(){
    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">🔔 Notifications & Activité</h3>
        <div style="background:rgba(255,255,255,0.04); padding:12px; margin:8px 0; border-radius:12px; font-size:13px;">
            ✨ Bienvenue sur Market Fluid ! Tout est ultra fluide.
        </div>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:15px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer; font-weight:bold;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

let uploadedSellImage = "";
let uploadedSellVideos = [];

function openSell(){
    uploadedSellImage = "";
    uploadedSellVideos = [];

    document.getElementById("box").innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <div style="display:flex; align-items:center; gap:8px;">
                <div style="width:36px; height:36px; border-radius:12px; background:linear-gradient(135deg, #00ff99, #00ccff); display:flex; align-items:center; justify-content:center; color:black; font-size:18px; font-weight:bold;">✨</div>
                <h3 style="margin:0; font-size:18px; font-weight:700;">Créer une annonce</h3>
            </div>
            <button onclick="document.getElementById('modal').style.display='none'" style="background:rgba(255,255,255,0.06); border:none; width:32px; height:32px; border-radius:50%; color:white; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;">✕</button>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 14px; max-height: 72vh; overflow-y: auto; padding-right: 4px;">
            <div>
                <label style="font-size:11px; opacity:0.7; font-weight:600; text-transform: uppercase; letter-spacing: 0.5px;">Titre de l'annonce</label>
                <input id="newPostName" placeholder="Ex: Casque Gamer RGB Pro..." style="margin-top:4px;">
            </div>
            
            <div>
                <label style="font-size:11px; opacity:0.7; font-weight:600; text-transform: uppercase; letter-spacing: 0.5px;">Prix (en pièces 💰)</label>
                <input id="newPostPrice" type="number" placeholder="Ex: 150" style="margin-top:4px;">
            </div>

            <!-- SECTION PHOTO PRINCIPALE -->
            <div>
                <label style="font-size:11px; opacity:0.7; font-weight:600; text-transform: uppercase; letter-spacing: 0.5px; display:block; margin-bottom:6px;">Photo principale de l'annonce</label>
                
                <div id="imageDropZone" class="custom-drop-zone" onclick="document.getElementById('imageFileInput').click()" ondragover="handleDragOver(event, 'image')" ondragleave="handleDragLeave(event, 'image')" ondrop="handleImageDrop(event)">
                    <div style="font-size: 28px; margin-bottom: 6px;">🖼️</div>
                    <div style="font-weight: 600; font-size: 13px; color: white;">Glisse ta photo ici</div>
                    <div style="font-size: 11px; opacity: 0.5; margin-top: 2px;">ou clique pour parcourir</div>
                    <input type="file" id="imageFileInput" accept="image/*" style="display:none" onchange="handleImageFileSelect(this)">
                </div>

                <div id="imagePreviewContainer" style="display:none; position: relative; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid rgba(255,255,255,0.1);"></div>
            </div>

            <!-- SECTION MULTI-VIDÉOS -->
            <div>
                <label style="font-size:11px; opacity:0.7; font-weight:600; text-transform: uppercase; letter-spacing: 0.5px; display:block; margin-bottom:6px;">Vidéos additionnelles (Optionnel)</label>
                
                <div id="videoDropZone" class="custom-drop-zone" onclick="document.getElementById('videoFileInput').click()" ondragover="handleDragOver(event, 'video')" ondragleave="handleDragLeave(event, 'video')" ondrop="handleVideoDrop(event)">
                    <div style="font-size: 28px; margin-bottom: 6px;">🎥</div>
                    <div style="font-weight: 600; font-size: 13px; color: white;">Glisse tes vidéos ici</div>
                    <div style="font-size: 11px; opacity: 0.5; margin-top: 2px;">ou clique pour en ajouter plusieurs</div>
                    <input type="file" id="videoFileInput" accept="video/*" multiple style="display:none" onchange="handleVideoFileSelect(this)">
                </div>

                <div id="videosPreviewList" style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;"></div>
            </div>
            
            <div>
                <label style="font-size:11px; opacity:0.7; font-weight:600; text-transform: uppercase; letter-spacing: 0.5px;">Description détaillée</label>
                <textarea id="newPostDesc" placeholder="Décris ton article, ses caractéristiques..." style="height:80px; resize:none; margin-top:4px;"></textarea>
            </div>
        </div>
        
        <div style="display: flex; gap: 8px; margin-top: 16px;">
            <button onclick="document.getElementById('modal').style.display='none'" style="flex: 1; padding: 13px; border: none; border-radius: 14px; background: rgba(255,255,255,0.06); color: white; cursor: pointer; font-weight: 600; font-size: 14px;">Annuler</button>
            <button onclick="submitPost()" style="flex: 2; padding: 13px; background: linear-gradient(135deg, #00ff99, #00ccff); border: none; border-radius: 14px; font-weight: bold; cursor: pointer; color: black; font-size: 14px; box-shadow: 0 4px 20px rgba(0,255,153,0.3);">Publier l'annonce</button>
        </div>
    `;
    document.getElementById("modal").style.display = "flex";
}

function handleDragOver(e, type) {
    e.preventDefault();
    e.stopPropagation();
    document.getElementById(type + 'DropZone').classList.add('dragover');
}

function handleDragLeave(e, type) {
    e.preventDefault();
    e.stopPropagation();
    document.getElementById(type + 'DropZone').classList.remove('dragover');
}

function handleImageDrop(e) {
    e.preventDefault();
    e.stopPropagation();
    document.getElementById('imageDropZone').classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        processImageFile(e.dataTransfer.files[0]);
    }
}

function handleImageFileSelect(input) {
    if (input.files && input.files[0]) {
        processImageFile(input.files[0]);
    }
}

function processImageFile(file) {
    let reader = new FileReader();
    reader.onload = function(e) {
        uploadedSellImage = e.target.result;
        let previewContainer = document.getElementById('imagePreviewContainer');
        let dropZone = document.getElementById('imageDropZone');

        previewContainer.innerHTML = `
            <img src="${uploadedSellImage}" style="width: 100%; max-height: 160px; object-fit: cover; display: block;">
            <button onclick="clearImage()" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); border: none; color: white; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center;">✕</button>
        `;
        dropZone.style.display = 'none';
        previewContainer.style.display = 'block';
    };
    reader.readAsDataURL(file);
}

function clearImage() {
    uploadedSellImage = "";
    document.getElementById('imagePreviewContainer').style.display = 'none';
    document.getElementById('imagePreviewContainer').innerHTML = '';
    document.getElementById('imageDropZone').style.display = 'block';
    document.getElementById('imageFileInput').value = '';
}

function handleVideoDrop(e) {
    e.preventDefault();
    e.stopPropagation();
    document.getElementById('videoDropZone').classList.remove('dragover');
    if (e.dataTransfer.files) {
        processVideoFiles(e.dataTransfer.files);
    }
}

function handleVideoFileSelect(input) {
    if (input.files) {
        processVideoFiles(input.files);
    }
}

function processVideoFiles(files) {
    for (let file of files) {
        if (!file.type.startsWith('video')) continue;
        let reader = new FileReader();
        reader.onload = function(e) {
            uploadedSellVideos.push(e.target.result);
            renderVideosPreview();
        };
        reader.readAsDataURL(file);
    }
}

function renderVideosPreview() {
    let listContainer = document.getElementById('videosPreviewList');
    if (uploadedSellVideos.length > 0) {
        document.getElementById('videoDropZone').style.display = 'none';
    }

    listContainer.innerHTML = uploadedSellVideos.map((vid, index) => `
        <div style="position: relative; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); padding: 4px; display: flex; align-items: center; gap: 8px;">
            <video src="${vid}" style="width: 60px; height: 45px; object-fit: cover; border-radius: 8px;"></video>
            <span style="font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Vidéo #${index + 1}</span>
            <button onclick="removeVideo(${index})" style="background: rgba(255,0,0,0.2); border: none; color: #ff4d4d; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; margin-right: 4px;">✕</button>
        </div>
    `).join('') + `
        <button onclick="document.getElementById('videoFileInput').click()" style="background: rgba(255,255,255,0.06); border: 1px dashed rgba(255,255,255,0.2); color: white; padding: 8px; border-radius: 12px; font-size: 12px; cursor: pointer; font-weight: 600; margin-top: 4px;">+ Ajouter une autre vidéo</button>
    `;
}

function removeVideo(index) {
    uploadedSellVideos.splice(index, 1);
    if (uploadedSellVideos.length === 0) {
        document.getElementById('videoDropZone').style.display = 'block';
        document.getElementById('videosPreviewList').innerHTML = '';
        document.getElementById('videoFileInput').value = '';
    } else {
        renderVideosPreview();
    }
}

async function submitPost(){
    let name = document.getElementById("newPostName").value.trim();
    let price = Number(document.getElementById("newPostPrice").value);
    let desc = document.getElementById("newPostDesc").value.trim();

    if(!name || isNaN(price)){
        alert("Remplis le nom et le prix correctement !");
        return;
    }

    if(!uploadedSellImage){
        alert("Tu dois impérativement ajouter une photo principale !");
        return;
    }

    let { error } = await client.from("posts").insert([{
        name: name,
        price: price,
        image: uploadedSellImage,
        videos: uploadedSellVideos,
        desc: desc,
        user_id: user,
        likes: 0,
        views: 0
    }]);

    if(error){
        alert("Erreur lors de la publication.");
        return;
    }

    document.getElementById("modal").style.display = "none";
    if(navigator.vibrate) navigator.vibrate(40);
    loadPosts();
}

async function loadPosts(){
    if(loading) return;
    loading = true;

    try {
        let { data, error } = await client
            .from("posts")
            .select("id, name, price, desc, user_id, likes, views, image, videos")
            .order("id", { ascending: false })
            .limit(100);

        if(error){
            console.error("Erreur Supabase:", error);
            document.getElementById("feed").innerHTML = `<div style='display:flex; height:70vh; align-items:center; justify-content:center; opacity:0.6; text-align:center; padding:20px;'>Erreur serveur. Réessaie.</div>`;
            loading = false;
            return;
        }

        if(!data || data.length === 0){
            loading = false;
            document.getElementById("feed").innerHTML = "<div style='display:flex; height:70vh; align-items:center; justify-content:center; opacity:0.5;'>Aucune annonce trouvée</div>";
            return;
        }

        posts = data;
        render();
    } catch(err) {
        console.error("Erreur réseau :", err);
    } finally {
        loading = false;
    }
}

async function loadAvatar(post){
    if(usersCache[post.user_id] !== undefined){
        let img = usersCache[post.user_id]?.avatar || "";
        let el = document.getElementById(`avatar-${post.id}`);
        if(el) el.innerHTML = img ? `<img src="${img}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;">` : "👤";
        return;
    }

    let { data } = await client
        .from("users")
        .select("avatar")
        .eq("username", post.user_id)
        .maybeSingle();

    usersCache[post.user_id] = data || null;
    let img = data?.avatar || "";
    let el = document.getElementById(`avatar-${post.id}`);
    if(el){
        el.innerHTML = img ? `<img src="${img}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;">` : "👤";
    }
}

async function deletePost(id){
    if(!confirm("Supprimer cette annonce ?")) return;
    let { error } = await client.from("posts").delete().eq("id", id);
    if(error){ alert("Erreur suppression"); return; }
    loadPosts();
}

function openChat(username){
    if(!user) return;
    if(username === user){ alert("Tu ne peux pas chatter avec toi-même 😅"); return; }
    localStorage.setItem("chatWith", username);
    window.location.href = "chat.html";
}

function getLikedPosts(){ return JSON.parse(localStorage.getItem("likedPosts") || "[]"); }
function isLiked(id){ return getLikedPosts().includes(id); }

async function likePost(id, currentLikes, event){
    let btn = event.currentTarget;
    let liked = isLiked(id);
    let newLikes = liked ? currentLikes - 1 : currentLikes + 1;

    let { error } = await client.from("posts").update({ likes: newLikes }).eq("id", id);
    if(error) return;

    let likedList = getLikedPosts();
    if(liked){ likedList = likedList.filter(x => x !== id); } else { likedList.push(id); }
    localStorage.setItem("likedPosts", JSON.stringify(likedList));

    if (navigator.vibrate) navigator.vibrate(50);
    let targetPost = posts.find(p => p.id === id);
    if(targetPost) targetPost.likes = newLikes;
    
    let likesEl = document.getElementById(`likes-count-${id}`);
    if(likesEl) likesEl.innerText = newLikes;
    
    if(liked){ btn.classList.remove('liked'); } else { btn.classList.add('liked'); }
}

function scorePost(p){ return (p.likes || 0) * 3 + (p.views || 0) * 0.5; }

// Fonction pour ouvrir le menu d'options (3 petits points) d'un post
function openPostOptions(postId, postUser) {
    let isMyPost = (postUser === user);
    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0; margin-bottom:14px;">⚙️ Options de l'annonce</h3>
        <div style="display:flex; flex-direction:column; gap:8px;">
            <button onclick="document.getElementById('modal').style.display='none'; location.href='profile.html?user=' + encodeURIComponent('${postUser}')" style="padding:12px; background:rgba(255,255,255,0.06); border:none; border-radius:12px; color:white; font-weight:600; text-align:left; cursor:pointer;">👤 Voir le profil de @${postUser}</button>
            <button onclick="document.getElementById('modal').style.display='none'; openChat('${postUser}')" style="padding:12px; background:rgba(255,255,255,0.06); border:none; border-radius:12px; color:white; font-weight:600; text-align:left; cursor:pointer;">💬 Envoyer un message</button>
            ${isMyPost ? `<button onclick="document.getElementById('modal').style.display='none'; deletePost(${postId})" style="padding:12px; background:rgba(255,0,0,0.15); border:none; border-radius:12px; color:#ff4d4d; font-weight:600; text-align:left; cursor:pointer;">🗑️ Supprimer cette annonce</button>` : ''}
        </div>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:15px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer; font-weight:bold;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

async function openInv() {
    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">📦 Mon Inventaire</h3>
        <div style="text-align:center; padding: 40px; opacity: 0.6;">Chargement...</div>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:15px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer; font-weight:bold;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";

    let { data } = await client
        .from("inventaire")
        .select("id, item, price, image")
        .eq("user_id", user)
        .order("id", { ascending: false });

    let items = data || [];

    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">📦 Mon Inventaire (${items.length})</h3>
        <div style="max-height: 50vh; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            ${items.length === 0 ? "<p style='opacity:0.6; text-align:center; grid-column: span 2;'>Ton inventaire est vide</p>" : ""}
            ${items.map(item => `
                <div style="background:rgba(255,255,255,0.04); padding:10px; border-radius:12px; text-align:center;">
                    <img src="${item.image}" loading="lazy" style="width:100%; height:90px; object-fit:cover; border-radius:8px; margin-bottom:6px;">
                    <b style="font-size:13px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.item}</b>
                    <span style="font-size:11px; color:#00ff99;">💰 ${item.price}</span>
                </div>
            `).join("")}
        </div>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:15px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer; font-weight:bold;">Fermer</button>
    `;
}

async function openComments(postId){
    let { data } = await client.from("comments").select("*").eq("post_id", postId).order("id", { ascending: false });
    let comments = data || [];

    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">💬 Commentaires</h3>
        <div style="max-height: 40vh; overflow-y: auto; margin-bottom: 10px;">
            ${comments.length === 0 ? "<p style='opacity:0.6; text-align:center;'>Aucun commentaire</p>" : ""}
            ${comments.map(c => `
                <div style="background:rgba(255,255,255,0.04); padding:10px; margin:6px 0; border-radius:10px;">
                    <b style="font-size:12px; color:#00ccff;">@${c.user_id}</b><br><span style="font-size:13px;">${c.text}</span>
                </div>
            `).join("")}
        </div>
        <textarea id="commentText" placeholder="Écris un commentaire..." style="height:70px; resize:none;"></textarea>
        <button onclick="addComment(${postId})" style="width:100%; padding:12px; margin-top:8px; background:#00ccff; border:none; border-radius:12px; font-weight:bold; cursor:pointer; color:black;">Envoyer</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:6px; padding:10px; border:none; border-radius:12px; background:transparent; opacity:0.7; color:white; cursor:pointer;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

async function addComment(postId){
    let text = document.getElementById("commentText").value.trim();
    if(!text) return;
    let { error } = await client.from("comments").insert([{ post_id: postId, user_id: user, text: text }]);
    if(error){ alert("Erreur envoi commentaire"); return; }
    openComments(postId);
}

function render(){
    let search = document.getElementById("search").value.toLowerCase();
    let minPrice = Number(document.getElementById("minPrice").value) || 0;
    let maxPrice = Number(document.getElementById("maxPrice").value) || Infinity;
    let videoOnly = document.getElementById("videoOnly").checked;
    let popularOnly = document.getElementById("popularOnly").checked;

    let filtered = posts.filter(p => {
        let matchSearch = p.name.toLowerCase().includes(search) || (p.desc && p.desc.toLowerCase().includes(search));
        let matchPrice = p.price >= minPrice && p.price <= maxPrice;
        let matchVideo = !videoOnly || (p.videos && p.videos.length > 0);
        return matchSearch && matchPrice && matchVideo;
    });

    if(popularOnly){
        filtered.sort((a, b) => scorePost(b) - scorePost(a));
    }

    let feed = document.getElementById("feed");
    if(filtered.length === 0){
        feed.innerHTML = "<div style='display:flex; height:70vh; align-items:center; justify-content:center; opacity:0.5;'>Aucune annonce correspondante</div>";
        return;
    }

    feed.innerHTML = filtered.map(p => {
        let liked = isLiked(p.id);
        return `
            <div class="post">
                <div class="card">
                    <div class="card-header-row">
                        <h2>${p.name}</h2>
                        <!-- Bouton 3 petits points verticaux -->
                        <button class="options-btn" onclick="openPostOptions(${p.id}, '${p.user_id}')" title="Options">⋮</button>
                    </div>

                    <img src="${p.image}" loading="lazy" onclick="openPostDetails(${p.id})">

                    <div class="info">
                        <!-- Nom d'utilisateur cliquable menant vers le profil -->
                        <div class="post-author" onclick="location.href='profile.html?user=' + encodeURIComponent('${p.user_id}')" title="Voir le profil">
                            <span id="avatar-${p.id}">👤</span>
                            <span>@${p.user_id}</span>
                        </div>
                        <span style="font-weight:bold; color:#00ff99; font-size:13px;">💰 ${p.price}</span>
                    </div>

                    <div class="card-actions">
                        <div class="buy-btn-wrapper">
                            <button class="buy-btn" onclick="buyItem(${p.id}, ${p.price}, '${p.name}', '${p.image}')">Acheter</button>
                            <span id="badge-${p.id}" class="success-badge">Acheté ! 🎉</span>
                        </div>
                        <button class="chat-btn-custom" onclick="openChat('${p.user_id}')">Contacter</button>
                        ${p.videos && p.videos.length > 0 ? `<button class="video-btn" onclick="openVideosModal(${p.id})">🎥 Vidéos</button>` : `<button class="comment-btn" onclick="openComments(${p.id})">💬 Avis</button>`}
                        <button class="likeBtn ${liked ? 'liked' : ''}" onclick="likePost(${p.id}, ${p.likes || 0}, event)">❤️ <span id="likes-count-${p.id}">${p.likes || 0}</span></button>
                    </div>
                </div>
            </div>
        `;
    }).join("");

    filtered.forEach(p => loadAvatar(p));
}

async function buyItem(id, price, name, image){
    let currentMoney = getMoney();
    if(currentMoney < price){
        alert("Tu n'as pas assez d'argent ! 💸");
        return;
    }

    let newMoney = currentMoney - price;
    localStorage.setItem("argent", newMoney);
    setMoney(newMoney);

    let { error } = await client.from("inventaire").insert([{
        user_id: user,
        item: name,
        price: price,
        image: image
    }]);

    if(error){
        alert("Erreur lors de l'achat.");
        return;
    }

    let badge = document.getElementById(`badge-${id}`);
    if(badge){
        badge.classList.add("show");
        setTimeout(() => badge.classList.remove("show"), 2000);
    }
    if(navigator.vibrate) navigator.vibrate(60);
}

function openPostDetails(id){
    let p = posts.find(x => x.id === id);
    if(!p) return;

    document.getElementById("box").innerHTML = `
        <h2 style="margin-top:0;">${p.name}</h2>
        <img src="${p.image}" style="width:100%; max-height:250px; object-fit:cover; border-radius:12px; margin-bottom:10px;">
        <p style="opacity:0.9; font-size:13px; line-height:1.4;">${p.desc || "Aucune description fournie."}</p>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.1);">
            <span onclick="location.href='profile.html?user=' + encodeURIComponent('${p.user_id}')" style="cursor:pointer; color:#00ccff; font-weight:600;">@${p.user_id}</span>
            <span style="color:#00ff99; font-weight:bold;">💰 ${p.price}</span>
        </div>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:15px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer; font-weight:bold;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

function openVideosModal(id){
    let p = posts.find(x => x.id === id);
    if(!p || !p.videos) return;

    document.getElementById("box").innerHTML = `
        <h3 style="margin-top:0;">🎥 Vidéos de l'annonce</h3>
        <div style="display:flex; flex-direction:column; gap:12px; max-height:60vh; overflow-y:auto;">
            ${p.videos.map((vid, idx) => `
                <div>
                    <video src="${vid}" controls style="width:100%; border-radius:12px; background:#000;"></video>
                </div>
            `).join("")}
        </div>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:15px; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:white; cursor:pointer; font-weight:bold;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

window.onload = async () => {
    await loadProfile();
    await loadPosts();
};
</script>
</body>
