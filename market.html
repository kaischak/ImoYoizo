<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0f">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market FIXED</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
    overflow-x: hidden;
}

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    align-items: center;
    padding: 0 10px;
    background: rgba(11, 11, 15, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 10;
    gap: 10px;
    transform: translateZ(0);
}

/* LEFT */
#miniProfile {
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* CENTER */
#search {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: #16161d;
    color: white;
}

/* RIGHT */
.topbar-right {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    align-items: center;
}

.topbar-right button, #addBtn {
    background: rgba(255, 255, 255, 0.08);
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    color: white;
    transition: transform 0.1s ease;
}

#addBtn {
    background: #00ff99;
    color: black;
    font-weight: bold;
    font-size: 20px;
}

.topbar-right button:active, #addBtn:active {
    transform: scale(0.9);
}

/* FEED */
#feed {
    padding-top: 60px;
    min-height: 100vh;
    transform: translateZ(0);
}

.post {
    display: flex;
    justify-content: center;
    padding: 20px 0;
    will-change: transform;
}

.card {
    width: 90%;
    max-width: 450px;
    background: #16161d;
    border-radius: 20px;
    padding: 15px;
    text-align: center;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

.card img {
    width: 100%;
    border-radius: 15px;
    aspect-ratio: 4/3;
    object-fit: cover;
    background: #222;
}

/* INFO */
.info {
    text-align: left;
    margin-top: 10px;
    line-height: 1.5;
}

/* BUTTONS CARD */
.card button {
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
}

.card button:active {
    transform: scale(0.97);
}

.likeBtn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    color: white;
    margin: 10px auto 0 auto;
}

.likeBtn.liked {
    background: rgba(0, 255, 153, 0.25);
    color: #00ff99;
}

/* MODAL */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 100;
    backdrop-filter: blur(5px);
}

.box {
    width: 100%;
    max-width: 500px;
    background: #16161d;
    padding: 20px;
    border-radius: 20px;
    max-height: 90vh;
    overflow-y: auto;
    box-sizing: border-box;
    transform: translateZ(0);
}

/* ANIMATION COEUR */
.like-pop {
    position: absolute;
    font-size: 18px;
    animation: pop 0.6s ease forwards;
    pointer-events: none;
}

@keyframes pop {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
    100% { transform: translate(-50%, -120%) scale(1.6); opacity: 0; }
}

input, textarea {
    width: 100%;
    margin: 5px 0;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #20202b;
    color: white;
    outline: none;
}
</style>
</head>

<body>

<div class="topbar">
    <!-- LEFT -->
    <div id="miniProfile">
        <strong id="pname">loading...</strong>
        <div id="money"></div>
    </div>

    <!-- CENTER -->
    <input id="search" placeholder="Recherche..." oninput="render()">

    <!-- RIGHT -->
    <div class="topbar-right">
        <button id="addBtn" onclick="openSell()">+</button>
        <button onclick="openInv()" title="Inventaire">📦</button>
        <button onclick="location.href='friends.html'" title="Amis">👥</button>
        <button onclick="location.href='profile.html'" title="Profil">👤</button>
        <button onclick="toggleFilters()" title="Filtres">🔍</button>
    </div>
</div>

<div id="filters" style="display:none; padding:15px; background:#16161d; margin-top:60px;">
    <input id="minPrice" type="number" placeholder="💰 Prix minimum" oninput="render()">
    <input id="maxPrice" type="number" placeholder="💰 Prix maximum" oninput="render()">
</div>

<div id="feed"></div>

<div id="modal" class="modal">
    <div class="box" id="box"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
let user = localStorage.getItem("user");

if(!user || user.startsWith("user")){
    localStorage.removeItem("user");
    window.location.href = "auth.html";
}

const supabaseUrl = "https://eezsocswqhqgkvghhygq.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlenNvY3N3cWhxZ2t2Z2hoeWdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjg5MjYsImV4cCI6MjA5NjY0NDkyNn0.TVI962lsUo67i6Ltq8okbOw-_GO-5yc4KDCyc8OkdVQ";
const client = supabase.createClient(supabaseUrl, supabaseKey);

let posts = [];
let usersCache = {};
let limit = 10;
let offset = 0;
let loading = false;
let allLoaded = false;

async function updateLastSeen(){
    await client.from("users").update({ last_seen: new Date() }).eq("username", user);
}

function getMoney(){
    return Number(localStorage.getItem("argent") || 0);
}

function setMoney(v){
    document.getElementById("money").innerText = "💰 " + v;
}

async function loadProfile(){
    document.getElementById("pname").innerText = "👤 " + user;
    setMoney(getMoney());
}

function toggleFilters(){
    let filters = document.getElementById("filters");
    filters.style.display = filters.style.display === "none" ? "block" : "none";
}

async function loadPosts(reset = false){
    if(loading) return;
    loading = true;

    if(reset){
        offset = 0;
        allLoaded = false;
        posts = [];
        document.getElementById("feed").innerHTML = "";
    }

    let { data, error } = await client
        .from("posts")
        .select("*")
        .order("id", { ascending: false })
        .range(offset, offset + limit - 1);

    if(error){
        console.log(error);
        loading = false;
        return;
    }

    if(data.length === 0){
        allLoaded = true;
        loading = false;
        render();
        return;
    }

    posts = posts.concat(data);
    offset += limit;

    render();
    loading = false;
}

window.addEventListener("scroll", () => {
    if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 300){
        if(!allLoaded) loadPosts();
    }
});

async function getUser(username){
    if(usersCache[username]) return usersCache[username];
    let { data } = await client.from("users").select("avatar, last_seen").eq("username", username).maybeSingle();
    usersCache[username] = data;
    return data;
}

function getLikedPosts(){
    return JSON.parse(localStorage.getItem("likedPosts") || "[]");
}

function isLiked(id){
    return getLikedPosts().includes(id);
}

function toggleLiked(id){
    let liked = getLikedPosts();
    if(liked.includes(id)){
        liked = liked.filter(x => x !== id);
    } else {
        liked.push(id);
    }
    localStorage.setItem("likedPosts", JSON.stringify(liked));
}

function isOnline(lastSeen){
    if(!lastSeen) return false;
    return Date.now() - new Date(lastSeen).getTime() < 60000;
}

async function likePost(id, currentLikes, event){
    let btn = event.currentTarget;
    let liked = isLiked(id);
    let newLikes = liked ? currentLikes - 1 : currentLikes + 1;

    let { error } = await client.from("posts").update({ likes: newLikes }).eq("id", id);
    if(error) return;

    toggleLiked(id);

    if (navigator.vibrate) navigator.vibrate(50);

    let pop = document.createElement("div");
    pop.className = "like-pop";
    pop.innerHTML = "❤️";
    pop.style.left = "50%";
    pop.style.top = "50%";
    btn.appendChild(pop);
    setTimeout(() => pop.remove(), 600);

    // Mise à jour locale rapide sans tout recharger
    let p = posts.find(x => x.id === id);
    if(p) p.likes = newLikes;
    render();
}

function getFavorites(){
    return JSON.parse(localStorage.getItem("favorites") || "[]");
}

function toggleFavorite(id){
    let favs = getFavorites();
    if(favs.includes(id)){
        favs = favs.filter(x => x !== id);
    } else {
        favs.push(id);
    }
    localStorage.setItem("favorites", JSON.stringify(favs));
    render();
}

async function addView(postId){
    let seen = JSON.parse(localStorage.getItem("seenPosts") || "[]");
    if(seen.includes(postId)) return;
    seen.push(postId);
    localStorage.setItem("seenPosts", JSON.stringify(seen));

    await client.rpc('increment_views', { post_id: postId }).catch(() => {
        // Fallback si la fonction RPC n'existe pas
    });
}

async function render(){
    let s = document.getElementById("search").value.toLowerCase();
    let minPrice = Number(document.getElementById("minPrice")?.value || 0);
    let maxPrice = Number(document.getElementById("maxPrice")?.value || Infinity);
    let feed = document.getElementById("feed");
    
    let filteredPosts = posts.filter(p => {
        let matchName = (p.name || "").toLowerCase().includes(s);
        let price = Number(p.price || 0);
        let matchPrice = price >= minPrice && (maxPrice === 0 || price <= maxPrice);
        return matchName && matchPrice;
    });

    if(filteredPosts.length === 0 && posts.length > 0){
        feed.innerHTML = "<p style='text-align:center; padding:20px;'>Aucun résultat</p>";
        return;
    }

    // Utilisation d'un DocumentFragment pour booster drastiquement les performances d'affichage
    let fragment = document.createDocumentFragment();

    for (let p of filteredPosts) {
        let userData = await getUser(p.user_id);
        let div = document.createElement("div");
        div.className = "post";

        div.innerHTML = `
        <div class="card" onclick="openPost(${p.id})" style="cursor:pointer;">
            <h2>${p.name}</h2>
            <img src="${p.image}" loading="lazy">
            <div class="info">
                💰 ${p.price}<br>
                ❤️ ${p.likes || 0}<br>
                👀 ${p.views || 0} vues <br>
                ${userData && isOnline(userData.last_seen) ? "🟢 En ligne" : "⚫ Hors ligne"}<br>
                <span onclick="event.stopPropagation(); openUserMenu('${p.user_id}')" style="color:#00ccff; cursor:pointer;">
                    👤 ${p.user_id}
                </span>
            </div>

            <button onclick="event.stopPropagation(); buy(${p.id}, event)" style="margin-top:10px; width:100%; padding:10px; border:none; border-radius:15px; background:#00ff99; color:black; font-weight:bold;">
                🛒 BUY
            </button>

            <button onclick="event.stopPropagation(); openChat('${p.user_id}')" style="margin-top:10px; padding:10px; border:none; border-radius:15px; background:#00ccff; color:black; width:100%; font-weight:bold;">
                💬 Chat
            </button>

            <button class="likeBtn ${isLiked(p.id) ? 'liked' : ''}" onclick="event.stopPropagation(); likePost(${p.id}, ${p.likes || 0}, event)">
                ❤️
            </button>

            <button onclick="event.stopPropagation(); openComments(${p.id})" style="margin-top:10px; width:100%; padding:10px; border:none; border-radius:15px; background:#2d6bff; color:white; font-weight:bold;">
                💬 Commentaires
            </button>

            <button onclick="event.stopPropagation(); toggleFavorite(${p.id})" style="margin-top:10px; width:100%; padding:10px; border:none; border-radius:15px; background:gold; color:black; font-weight:bold;">
                ${getFavorites().includes(p.id) ? "⭐ Favori" : "☆ Ajouter aux favoris"}
            </button>

            ${p.user_id === user ? `
                <button onclick="event.stopPropagation(); deletePost(${p.id})" style="background:red; color:white; margin-top:10px; width:100%; border:none; border-radius:15px; padding:10px; font-weight:bold;">
                    🗑 Supprimer
                </button>
            ` : ""}
        </div>`;

        fragment.appendChild(div);
        addView(p.id);
    }

    if(allLoaded){
        let end = document.createElement("div");
        end.style.textAlign = "center";
        end.style.padding = "20px";
        end.style.opacity = "0.5";
        end.innerText = "Fin du feed";
        fragment.appendChild(end);
    }

    feed.innerHTML = "";
    feed.appendChild(fragment);
}

function openPost(id){
    let p = posts.find(x => x.id === id);
    if(!p) return;
    document.getElementById("box").innerHTML = `
        <h1>${p.name}</h1>
        <img src="${p.image}" style="width:100%; border-radius:20px;">
        <br><br>📝 ${p.desc || 'Aucune description'}
        <br><br>💰 ${p.price}
        <br><br>❤️ ${p.likes || 0}
        <br><br>👤 ${p.user_id}
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:15px; padding:12px; border:none; border-radius:12px; background:#333; color:white;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

async function openComments(postId){
    let { data } = await client.from("comments").select("*").eq("post_id", postId).order("id", { ascending: false });
    let comments = data || [];

    document.getElementById("box").innerHTML = `
        <h2>💬 Commentaires</h2>
        <div style="max-height: 40vh; overflow-y: auto;">
            ${comments.map(c => `
                <div style="background:#222; padding:10px; margin:8px 0; border-radius:12px;">
                    <b>${c.user_id}</b><br>${c.text}
                </div>
            `).join("")}
        </div>
        <textarea id="commentText" placeholder="Écris un commentaire..."></textarea>
        <button onclick="addComment(${postId})" style="width:100%; padding:12px; margin-top:10px; background:#00ccff; border:none; border-radius:12px; font-weight:bold; color:black;">Envoyer</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:10px; padding:12px; border:none; border-radius:12px; background:#333; color:white;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

async function addComment(postId){
    let text = document.getElementById("commentText").value.trim();
    if(!text) return;
    await client.from("comments").insert([{ post_id: postId, user_id: user, text: text }]);
    openComments(postId);
}

async function buy(id, event){
    let btn = event?.currentTarget;
    let { data, error } = await client.from("posts").select("*").eq("id", id).single();
    if(error) return;

    let money = getMoney();
    let price = Number(data.price);

    if(money < price){
        alert("Pas assez d'argent !");
        return;
    }

    await client.from("inventaire").insert([{ user_id: user, item: data.name, image: data.image, price: data.price }]);

    money -= price;
    localStorage.setItem("argent", money);
    setMoney(money);

    if(btn){
        btn.innerText = "✔ ACHETÉ";
        setTimeout(() => btn.innerText = "🛒 BUY", 1200);
    }
    if(navigator.vibrate) navigator.vibrate([20, 30, 20]);
    alert("Acheté avec succès !");
}

function openSell(){
    document.getElementById("box").innerHTML = `
        <h1 style="text-align:center;">🚀 Nouvelle Annonce</h1>
        <input id="name" placeholder="📦 Nom de l'objet">
        <textarea id="desc" placeholder="📝 Description..." style="height:80px; resize:none;"></textarea>
        <input id="price" type="number" placeholder="💰 Prix">
        
        <div id="dropZone" style="border:2px dashed #00ff99; border-radius:15px; padding:20px; text-align:center; cursor:pointer; margin:10px 0; background:rgba(0,255,153,.05);">
            🖼️ <b>Glisse une image ici</b> ou clique
            <input id="fileInput" type="file" accept="image/*" style="display:none;">
        </div>
        <img id="preview" style="display:none; width:100%; border-radius:15px; max-height:200px; object-fit:cover;">

        <button onclick="createPost()" style="width:100%; padding:15px; border:none; border-radius:15px; font-weight:bold; background:#00ff99; color:black; margin-top:10px; cursor:pointer;">Publier</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; padding:10px; border:none; border-radius:15px; background:#333; color:white; margin-top:5px; cursor:pointer;">Fermer</button>
    `;

    document.getElementById("modal").style.display = "flex";
    
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    dropZone.onclick = () => fileInput.click();

    fileInput.onchange = e => {
        let file = e.target.files[0];
        if(file){
            let reader = new FileReader();
            reader.onload = ev => {
                window.selectedImage = ev.target.result;
                let prev = document.getElementById("preview");
                prev.src = ev.target.result;
                prev.style.display = "block";
            };
            reader.readAsDataURL(file);
        }
    };
}

async function createPost(){
    let name = document.getElementById("name").value.trim();
    let desc = document.getElementById("desc").value.trim();
    let price = Number(document.getElementById("price").value);

    if(!name || !price){
        alert("Nom et prix obligatoires !");
        return;
    }

    let { error } = await client.from("posts").insert([{
        name: name,
        image: window.selectedImage || "",
        price: price,
        desc: desc,
        user_id: user,
        likes: 0
    }]);

    if(error){
        alert("Erreur lors de la publication");
        return;
    }

    alert("Annonce publiée ! 🚀");
    document.getElementById("modal").style.display = "none";
    window.selectedImage = "";
    loadPosts(true);
}

async function openInv(){
    let { data } = await client.from("inventaire").select("*").eq("user_id", user);
    let items = data || [];

    document.getElementById("box").innerHTML = `
        <h2>📦 Inventaire</h2>
        ${items.length === 0 ? "<p>Aucun objet 😢</p>" : ""}
        ${items.map(i => `
            <div style="background:#222; padding:10px; margin:10px 0; border-radius:12px; display:flex; align-items:center; gap:10px;">
                <img src="${i.image}" style="width:40px; height:40px; border-radius:8px; object-fit:cover;">
                <div style="flex:1;"><b>${i.item}</b><br>💰 ${i.price}</div>
            </div>
        `).join("")}
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; padding:10px; border:none; border-radius:10px; background:#333; color:white;">Fermer</button>
    `;
    document.getElementById("modal").style.display = "flex";
}

// Initialisation
loadPosts(true);
loadProfile();
setInterval(updateLastSeen, 30000);

const modal = document.getElementById("modal");
modal.addEventListener("click", (e) => {
    if(e.target === modal) modal.style.display = "none";
});
</script>

</body>
</html>
