<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Profil - Market Fluid</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b0b0f;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px 20px 40px 20px;
    user-select: none;
}

.profile-card {
    width: 100%;
    max-width: 400px;
    background: #16161d;
    border-radius: 28px;
    padding: 28px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
    text-align: center;
    animation: fadeInCard 0.4s ease;
    margin-top: 10px;
}

@keyframes fadeInCard {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

h2 {
    margin-top: 0;
    font-size: 22px;
    margin-bottom: 4px;
}

#username-display {
    font-size: 14px;
    color: #00ccff;
    font-weight: 600;
    margin-bottom: 20px;
}

.avatar-container {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 20px auto;
    cursor: pointer;
}

#avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: #252530;
    border: 3px solid #00ccff;
    box-shadow: 0 0 20px rgba(0,204,255,0.3);
    transition: transform 0.2s;
}

.avatar-container.editable:active #avatar {
    transform: scale(0.95);
}

.avatar-overlay {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    opacity: 0;
    transition: opacity 0.2s;
}

.avatar-container.editable:hover .avatar-overlay {
    opacity: 1;
}

input[type="file"] {
    display: none;
}

.input-group {
    text-align: left;
    margin-bottom: 15px;
}

.input-group label {
    font-size: 12px;
    opacity: 0.7;
    margin-left: 4px;
    display: block;
    margin-bottom: 4px;
}

input[type="text"], textarea {
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    border: none;
    background: rgba(255,255,255,0.06);
    color: white;
    font-size: 14px;
    outline: none;
    transition: background 0.2s, box-shadow 0.2s;
}
input[type="text"]:focus, textarea:focus {
    background: rgba(255,255,255,0.12);
    box-shadow: 0 0 0 2px rgba(0,255,153,0.3);
}

.file-btn {
    display: block;
    width: 100%;
    padding: 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 15px;
    border: 1px solid rgba(255,255,255,0.05);
    transition: background 0.2s, transform 0.1s;
}
.file-btn:active { transform: scale(0.97); background: rgba(255,255,255,0.15); }

.save-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-weight: bold;
    font-size: 15px;
    background: linear-gradient(135deg, #00ff99, #00ccff);
    color: black;
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 4px 15px rgba(0,255,153,0.2);
    margin-top: 5px;
}
.save-btn:active { transform: scale(0.95); }

.action-buttons {
    display: flex;
    gap: 8px;
    margin-top: 5px;
}

.msg-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-weight: bold;
    font-size: 15px;
    background: #00ccff;
    color: black;
    cursor: pointer;
}

.back-btn {
    background: transparent;
    border: none;
    color: white;
    opacity: 0.7;
    margin-top: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: opacity 0.2s;
}
.back-btn:hover { opacity: 1; }
</style>
</head>

<body>

<div class="profile-card">
    <h2 id="page-title">👤 Mon Profil</h2>
    <div id="username-display">Chargement...</div>

    <div class="avatar-container" id="avatarContainer">
        <!-- Avatar par défaut via SVG intégré (style minimaliste) -->
        <img id="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>" alt="Avatar">
        <div class="avatar-overlay" id="avatarOverlay">📷</div>
    </div>

    <input type="file" id="file" accept="image/*">
    <div id="fileBtnWrapper">
        <label for="file" class="file-btn">🖼️ Changer d'avatar</label>
    </div>

    <div class="input-group">
        <label>Nom d'affichage</label>
        <input type="text" id="displayNameInput" placeholder="Ex: Jean Dupont">
    </div>

    <div class="input-group">
        <label>Bio / Description</label>
        <textarea id="bioInput" placeholder="Quelques mots sur toi..." style="height:70px; resize:none;"></textarea>
    </div>

    <div id="actionArea">
        <button class="save-btn" onclick="save()">💾 Sauvegarder</button>
    </div>
</div>

<button class="back-btn" onclick="history.back()">← Retour</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://eezsocswqhqgkvghhygq.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlenNvY3N3cWhxZ2t2Z2hoeWdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjg5MjYsImV4cCI6MjA5NjY0NDkyNn0.TVI962lsUo67i6Ltq8okbOw-_GO-5yc4KDCyc8OkdVQ";
const client = supabase.createClient(supabaseUrl, supabaseKey);

let loggedUser = localStorage.getItem("user");

if(!loggedUser || loggedUser.startsWith("user")){
    localStorage.removeItem("user");
    window.location.href = "auth.html";
}

const urlParams = new URLSearchParams(window.location.search);
let targetUser = urlParams.get("user") || loggedUser;
let isMyProfile = (targetUser === loggedUser);

let imageData = "";
const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

async function loadProfile(){
    if(!isMyProfile){
        document.getElementById("page-title").innerText = "👤 Profil de l'utilisateur";
        document.getElementById("fileBtnWrapper").style.display = "none";
        document.getElementById("avatarContainer").classList.remove("editable");
        document.getElementById("displayNameInput").disabled = true;
        document.getElementById("bioInput").disabled = true;
        
        document.getElementById("actionArea").innerHTML = `
            <div class="action-buttons">
                <button class="msg-btn" onclick="openChat('${targetUser}')">💬 Message</button>
            </div>
        `;
    } else {
        document.getElementById("avatarContainer").classList.add("editable");
    }

    document.getElementById("username-display").innerText = "@" + targetUser;

    let { data, error } = await client
        .from("users")
        .select("*")
        .eq("username", targetUser)
        .maybeSingle();

    if(error){
        console.error("Erreur de chargement:", error);
        return;
    }

    if(data){
        if(data.avatar){
            document.getElementById("avatar").src = data.avatar;
            imageData = data.avatar;
        } else {
            document.getElementById("avatar").src = defaultAvatar;
        }

        let nameInput = document.getElementById("displayNameInput");
        let bioInput = document.getElementById("bioInput");

        if(isMyProfile){
            nameInput.value = data.display_name || "";
            bioInput.value = data.bio || "";
        } else {
            nameInput.value = data.display_name || "Cet utilisateur n'a pas de nom d'affichage";
            bioInput.value = data.bio || "Cet utilisateur n'a pas de bio";
        }
    } else {
        document.getElementById("avatar").src = defaultAvatar;
        if(!isMyProfile){
            document.getElementById("displayNameInput").value = "Cet utilisateur n'a pas de nom d'affichage";
            document.getElementById("bioInput").value = "Cet utilisateur n'a pas de bio";
        }
    }
}

document.getElementById("file").onchange = e => {
    if(!isMyProfile) return;
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = ev => {
        imageData = ev.target.result;
        document.getElementById("avatar").src = imageData;
        if(navigator.vibrate) navigator.vibrate(20);
    };
    reader.readAsDataURL(file);
};

async function save(){
    if(!isMyProfile) return;

    let displayName = document.getElementById("displayNameInput").value.trim();
    let bio = document.getElementById("bioInput").value.trim();

    let btn = document.querySelector(".save-btn");
    btn.innerText = "Sauvegarde...";
    btn.style.opacity = "0.7";

    let { error } = await client
        .from("users")
        .update({ 
            avatar: imageData,
            display_name: displayName,
            bio: bio
        })
        .eq("username", loggedUser);

    btn.innerText = "💾 Sauvegarder";
    btn.style.opacity = "1";

    if(error){
        alert("Erreur lors de la mise à jour : " + error.message);
        return;
    }

    if(navigator.vibrate) navigator.vibrate([30, 40, 30]);
    alert("Profil mis à jour avec succès !");
}

function openChat(username){
    localStorage.setItem("chatWith", username);
    window.location.href = "chat.html";
}

loadProfile();
</script>

</body>
</html>
