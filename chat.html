<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Chat</title>
    <style>
        body{margin:0;font-family:Arial,sans-serif;background:#0b0b0f;color:white;display:flex;flex-direction:column;height:100vh;}
        #header{padding:15px;background:#16161d;font-weight:bold;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.05);}
        #with{opacity:0.7;font-size:14px;}
        #messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;}
        .msg{max-width:75%;padding:10px 14px;border-radius:18px;word-wrap:break-word;font-size:15px;}
        .me{background:#00ff99;color:black;align-self:flex-end;border-bottom-right-radius:5px;}
        .other{background:#1c1c2a;align-self:flex-start;border-bottom-left-radius:5px;}
        .recording{animation:pulse 1s infinite;}
        @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);}}
        #inputBar{display:flex;padding:10px;background:#16161d;gap:10px;border-top:1px solid rgba(255,255,255,0.05);}
        #input{flex:1;padding:12px;border:none;border-radius:12px;background:#1c1c2a;color:white;outline:none;}
        #sendBtn{width:50px;border:none;border-radius:12px;background:#00ccff;color:black;font-size:18px;cursor:pointer;}
        #recordBtn, #inputBar button{border:none;border-radius:12px;cursor:pointer;}
        #inputBar > button:nth-child(2){background:#ffd43b;color:black;padding:0 12px;font-size:16px;}
        #recordBtn{width:50px;background:#292936;color:white;font-size:20px;}
        .voice-message{width:250px;max-width:100%;padding:10px 12px;border-radius:16px;cursor:pointer;user-select:none;}
        .me .voice-message{background:rgba(0,0,0,.08);}
        .other .voice-message{background:rgba(255,255,255,.06);}
        .voice-top{display:flex;align-items:center;gap:9px;}
        .voice-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;}
        .voice-play{width:38px;height:38px;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#00ccff;color:#000;font-size:15px;cursor:pointer;flex-shrink:0;}
        .me .voice-play{background:#00ff99;}
        .voice-info{flex:1;min-width:0;}
        .voice-title{font-size:12px;font-weight:bold;opacity:.8;margin-bottom:5px;}
        .voice-progress{width:100%;height:5px;background:rgba(255,255,255,.18);border-radius:10px;overflow:hidden;}
        .voice-progress-bar{width:0%;height:100%;background:currentColor;border-radius:10px;}
        .voice-bottom{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;opacity:.6;}
        .voice-message audio{display:none;}
        .offer-container{display:flex;flex-direction:column;gap:5px;}
        .offer-price{font-size:18px;}
    </style>
</head>
<body>
    <div id="header">
        💬 Chat
        <div id="with">...</div>
    </div>
    <div id="messages"></div>
    <div id="inputBar">
        <input id="input" placeholder="Écris un message...">
        <button onclick="offerPrice()">💰 Offre</button>
        <button id="recordBtn">🎤</button>
        <button id="sendBtn" onclick="send()">➤</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const client = supabase.createClient(
            "https://eezsocswqhqgkvghhygq.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzZXNzb2Nzd3FocWdrdmdoeHlncSIsInJlZiI6ImVlenNvY3N3cWhxZ2t2Z2hoeWdxIiwiaWF0IjoxNzgxMDY4OTI2LCJleHAiOjIwOTY2NDQ5MjN9.TVI962lsUo67i6Ltq8okbOw-_GO-5yc4KDCyc8OkdVQ"
        );
        let user = localStorage.getItem("user");
        let friend = localStorage.getItem("chatWith");
        if(!user || !friend){
            alert("Erreur chat");
            location.href="index.html";
        }
        document.getElementById("with").innerText = "avec " + friend;
        let mediaRecorder;
        let chunks = [];
        const recordBtn = document.getElementById("recordBtn");
        let currentAudio = null;
        let currentVoiceBox = null;

        function formatTime(seconds){
            if(!isFinite(seconds)) return "0:00";
            let min = Math.floor(seconds / 60);
            let sec = Math.floor(seconds % 60);
            return min + ":" + String(sec).padStart(2,"0");
        }

        function stopCurrentVoice(){
            if(!currentAudio) return;
            currentAudio.pause();
            currentAudio.currentTime = 0;
            if(currentVoiceBox){
                currentVoiceBox.classList.remove("voice-playing");
                let button = currentVoiceBox.querySelector(".voice-play");
                if(button) button.innerText = "▶";
                let progress = currentVoiceBox.querySelector(".voice-progress-bar");
                if(progress) progress.style.width = "0%";
            }
            currentAudio = null;
            currentVoiceBox = null;
        }

        function playVoice(audio, box){
            if(currentAudio === audio){
                if(audio.paused){
                    audio.play().catch(e => console.log(e));
                } else {
                    audio.pause();
                }
                return;
            }
            stopCurrentVoice();
            currentAudio = audio;
            currentVoiceBox = box;
            audio.play().catch(e => console.log(e));
        }

        function setupVoicePlayer(box, audio){
            let button = box.querySelector(".voice-play");
            let progress = box.querySelector(".voice-progress-bar");
            let currentTime = box.querySelector(".voice-current-time");
            let duration = box.querySelector(".voice-duration");
            box.addEventListener("click", () => playVoice(audio, box));
            audio.addEventListener("loadedmetadata", () => {
                if(duration) duration.innerText = formatTime(audio.duration);
            });
            audio.addEventListener("timeupdate", () => {
                if(!audio.duration) return;
                let percent = (audio.currentTime / audio.duration) * 100;
                if(progress) progress.style.width = percent + "%";
                if(currentTime) currentTime.innerText = formatTime(audio.currentTime);
            });
            audio.addEventListener("play", () => {
                box.classList.add("voice-playing");
                if(button) button.innerText = "❚❚";
            });
            audio.addEventListener("pause", () => {
                box.classList.remove("voice-playing");
                if(button) button.innerText = "▶";
            });
            audio.addEventListener("ended", () => {
                box.classList.remove("voice-playing");
                if(button) button.innerText = "▶";
                if(progress) progress.style.width = "0%";
                if(currentTime) currentTime.innerText = "0:00";
                if(currentAudio === audio){
                    currentAudio = null;
                    currentVoiceBox = null;
                }
            });
        }

        async function load(){
            try {
                let usersRes = await client.from("users").select("username, avatar");
                let users = usersRes.data || [];
                let { data, error } = await client
                    .from("messages")
                    .select("*")
                    .or(`and(sender.eq.${user},receiver.eq.${friend}),and(sender.eq.${friend},receiver.eq.${user})`)
                    .order("created_at", { ascending: true });
                if(error) {
                    console.error("Erreur Supabase messages:", error);
                    return;
                }
                let box = document.getElementById("messages");
                box.innerHTML = "";
                (data || []).forEach(m => {
                    let div = document.createElement("div");
                    div.className = "msg " + (m.sender === user ? "me" : "other");
                    let u = users.find(x => x.username === m.sender);
                    let avatar = u?.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(m.sender)}`;
                    if(m.voice){
                        div.innerHTML = `
                            <div class="voice-message">
                                <div class="voice-top">
                                    <img src="${avatar}" class="voice-avatar">
                                    <button class="voice-play" type="button">▶</button>
                                    <div class="voice-info">
                                        <div class="voice-title">🎙 Message vocal</div>
                                        <div class="voice-progress"><div class="voice-progress-bar"></div></div>
                                        <div class="voice-bottom">
                                            <span class="voice-current-time">0:00</span>
                                            <span class="voice-duration">0:00</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        const voiceBox = div.querySelector(".voice-message");
                        const audio = document.createElement("audio");
                        audio.src = m.voice;
                        audio.preload = "metadata";
                        voiceBox.appendChild(audio);
                        setupVoicePlayer(voiceBox, audio);
                    }
                    else if(m.offer_price){
                        let statusText = m.offer_status === "accepted" ? "✔ Acceptée" : m.offer_status === "rejected" ? "❌ Refusée" : "⏳ En attente";
                        div.innerHTML = `
                            <div class="offer-container">
                                <img src="${avatar}" style="width:25px;height:25px;border-radius:50%;">
                                <span>💰 Offre :</span>
                                <b class="offer-price">${m.offer_price} 💰</b>
                                <small>${statusText}</small>
                                ${m.offer_status === "pending" ? `
                                    <div style="display:flex;gap:8px;margin-top:5px;">
                                        <button onclick="acceptOffer('${m.id}')" style="background:#00ff99;border:none;padding:6px 10px;border-radius:10px;cursor:pointer;">✔ Accepter</button>
                                        <button onclick="rejectOffer('${m.id}')" style="background:#ff3b3b;border:none;padding:6px 10px;border-radius:10px;color:white;cursor:pointer;">❌ Refuser</button>
                                    </div>
                                ` : ""}
                            </div>
                        `;
                    }
                    else {
                        div.innerHTML = `
                            <div style="display:flex;align-items:center;gap:8px;">
                                <img src="${avatar}" style="width:25px;height:25px;border-radius:50%;">
                                <span>${escapeHTML(m.message || "")}</span>
                            </div>
                        `;
                    }
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            } catch(err) {
                console.error("Erreur dans load():", err);
            }
        }

        function escapeHTML(text){
            let div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        async function send(){
            let input = document.getElementById("input");
            let msg = input.value.trim();
            if(!msg) return;
            let { error } = await client.from("messages").insert([{ sender: user, receiver: friend, message: msg }]);
            if(error) console.error("Erreur d'envoi :", error);
            input.value = "";
        }

        async function offerPrice(){
            let price = prompt("Ton offre ?");
            if(!price) return;
            await client.from("messages").insert([{ sender: user, receiver: friend, offer_price: Number(price), offer_status: "pending" }]);
        }

        async function acceptOffer(id){
            await client.from("messages").update({ offer_status: "accepted" }).eq("id", id);
            alert("✔ Offre acceptée 💰");
        }

        async function rejectOffer(id){
            await client.from("messages").update({ offer_status: "rejected" }).eq("id", id);
            alert("❌ Offre refusée");
        }

        document.getElementById("input").addEventListener("keydown", e => {
            if(e.key === "Enter") send();
        });

        recordBtn.onclick = async () => {
            try{
                recordBtn.innerText = "🔴 REC";
                recordBtn.classList.add("recording");
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                chunks = [];
                mediaRecorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    recordBtn.innerText = "🎤";
                    recordBtn.classList.remove("recording");
                    stream.getTracks().forEach(track => track.stop());
                    const blob = new Blob(chunks, { type: "audio/webm" });
                    const reader = new FileReader();
                    reader.onload = async e => {
                        await client.from("messages").insert([{ sender: user, receiver: friend, voice: e.target.result }]);
                    };
                    reader.readAsDataURL(blob);
                };
                mediaRecorder.start();
                setTimeout(() => {
                    if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
                }, 10000);
            }catch(error){
                console.error(error);
                recordBtn.innerText = "🎤";
                recordBtn.classList.remove("recording");
                alert("Impossible d'utiliser le micro.");
            }
        };

        // --- TEMPS RÉEL SUPABASE V2 CORRIGÉ ---
        client
            .channel('room_messages')
            .on(
                'postgres_changes',
                { event: '*', schema: 'public', table: 'messages' },
                payload => {
                    load();
                }
            )
            .subscribe();

        // Chargement initial
        load();
    </script>
</body>
</html>
