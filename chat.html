<!DOCTYPE html>

<html lang="fr">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta charset="UTF-8">

<title>Chat</title>

<style>

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0b0b0f; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

#header { padding: 15px; background: #16161d; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }

#with { opacity: 0.7; font-size: 14px; }

#messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }

.msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; word-wrap: break-word; font-size: 15px; animation: fadeIn 0.2s ease-out; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.me { background: #00ff99; color: black; align-self: flex-end; border-bottom-right-radius: 5px; }

.other { background: #1c1c2a; align-self: flex-start; border-bottom-left-radius: 5px; }

.recording { animation: pulse 1s infinite; background: #ff3b3b !important; color: white !important; }

@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

#inputBar { display: flex; padding: 10px; background: #16161d; gap: 10px; border-top: 1px solid rgba(255,255,255,0.05); align-items: center; }

#input { flex: 1; padding: 12px; border: none; border-radius: 12px; background: #1c1c2a; color: white; outline: none; font-size: 15px; }

#sendBtn { width: 50px; height: 45px; border: none; border-radius: 12px; background: #00ccff; color: black; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }

#sendBtn:active, button:active { opacity: 0.7; }

#recordBtn { width: 50px; height: 45px; border: none; border-radius: 12px; background: #292936; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

.offer-btn { border: none; padding: 6px 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; }

.voice-message { width: 230px; max-width: 100%; display: flex; align-items: center; gap: 10px; user-select: none; }

.voice-play { width: 36px; height: 36px; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #00ccff; color: #000; font-size: 14px; cursor: pointer; flex-shrink: 0; }

.me .voice-play { background: #000; color: #00ff99; }

.voice-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.voice-progress { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }

.voice-progress-bar { width: 0%; height: 100%; background: currentColor; border-radius: 10px; transition: width 0.1s linear; }

.voice-bottom { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.7; }

.offer-container { display: flex; flex-direction: column; gap: 6px; }

.offer-price { font-size: 18px; font-weight: bold; }

</style>

</head>

<body>

<div id="header">

💬 Chat

<div id="with">...</div>

</div>

<div id="messages"></div>

<div id="inputBar">

<input id="input" placeholder="Écris un message..." autocomplete="off">

<button class="offer-btn" onclick="offerPrice()" style="background:#ffd43b; color:black; height:45px;">💰 Offre</button>

<button id="recordBtn" title="Maintenir ou cliquer pour enregistrer">🎤</button>

<button id="sendBtn" onclick="send()">➤</button>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://eezsocswqhqgkvghhygq.supabase.co";

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlenNvY3N3cWhxZ2t2Z2hoeWdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjg5MjYsImV4cCI6MjA5NjY0NDkyNn0.TVI962lsUo67i6Ltq8okbOw-_GO-5yc4KDCyc8OkdVQ";

const client = supabase.createClient(supabaseUrl, supabaseKey);



let user = localStorage.getItem("user");

let friend = localStorage.getItem("chatWith");

if(!user || !friend){

alert("Erreur chat");

location.href="index.html";

}

document.getElementById("with").innerText = "avec " + friend;



let usersCache = {};

let mediaRecorder = null;

let audioChunks = [];

let currentAudio = null;

let currentVoiceBox = null;

const recordBtn = document.getElementById("recordBtn");

const messagesBox = document.getElementById("messages");



async function preloadUsers() {

let { data } = await client.from("users").select("username, avatar");

if (data) {

data.forEach(u => {

usersCache[u.username] = u.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.username)}`;

});

}

}



function getAvatar(username) {

return usersCache[username] || `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}`;

}



function formatTime(seconds){

if(!isFinite(seconds)) return "0:00";

let min = Math.floor(seconds / 60);

let sec = Math.floor(seconds % 60);

return min + ":" + String(sec).padStart(2,"0");

}



function stopCurrentVoice(){

if(currentAudio){

currentAudio.pause();

currentAudio.currentTime = 0;

currentAudio = null;

}

if(currentVoiceBox){

let btn = currentVoiceBox.querySelector(".voice-play");

let bar = currentVoiceBox.querySelector(".voice-progress-bar");

if(btn) btn.innerText = "▶";

if(bar) bar.style.width = "0%";

currentVoiceBox = null;

}

}



function setupVoicePlayer(box, audio){

let btn = box.querySelector(".voice-play");

let progress = box.querySelector(".voice-progress-bar");

let currentTime = box.querySelector(".voice-current-time");

let duration = box.querySelector(".voice-duration");



box.addEventListener("click", () => {

if(currentAudio === audio){

if(audio.paused) audio.play();

else audio.pause();

return;

}

stopCurrentVoice();

currentAudio = audio;

currentVoiceBox = box;

audio.play().catch(e => console.log(e));

});



audio.addEventListener("loadedmetadata", () => {

if(duration) duration.innerText = formatTime(audio.duration);

});

audio.addEventListener("timeupdate", () => {

if(audio.duration) {

progress.style.width = ((audio.currentTime / audio.duration) * 100) + "%";

currentTime.innerText = formatTime(audio.currentTime);

}

});

audio.addEventListener("play", () => btn.innerText = "⏸");

audio.addEventListener("pause", () => btn.innerText = "▶");

audio.addEventListener("ended", () => {

btn.innerText = "▶";

progress.style.width = "0%";

currentTime.innerText = "0:00";

currentAudio = null;

currentVoiceBox = null;

});

}



function createMessageElement(m) {

let div = document.createElement("div");

div.className = "msg " + (m.sender === user ? "me" : "other");

div.setAttribute("data-id", m.id);

let avatar = getAvatar(m.sender);



if(m.voice){

div.innerHTML = `

<div class="voice-message">

<button class="voice-play" type="button">▶</button>

<div class="voice-info">

<div style="font-size:11px; font-weight:bold; opacity:0.8;">🎙 Vocal</div>

<div class="voice-progress"><div class="voice-progress-bar"></div></div>

<div class="voice-bottom">

<span class="voice-current-time">0:00</span>

<span class="voice-duration">0:00</span>

</div>

</div>

</div>

`;

const audio = document.createElement("audio");

audio.src = m.voice;

audio.preload = "metadata";

div.querySelector(".voice-message").appendChild(audio);

setupVoicePlayer(div.querySelector(".voice-message"), audio);

}

else if(m.offer_price !== null && m.offer_price !== undefined){

let statusText = m.offer_status === "accepted" ? "✔ Acceptée" : m.offer_status === "rejected" ? "❌ Refusée" : "⏳ En attente";

div.innerHTML = `

<div class="offer-container">

<div style="display:flex; align-items:center; gap:6px;">

<img src="${avatar}" style="width:20px;height:20px;border-radius:50%;">

<span style="font-size:12px; opacity:0.8;">Offre d'argent</span>

</div>

<b class="offer-price">${m.offer_price} 💰</b>

<small class="offer-status-text">${statusText}</small>

<div class="offer-actions" style="${m.offer_status === 'pending' ? 'display:flex;gap:6px;margin-top:4px;' : 'display:none;'}">

<button class="offer-btn" onclick="acceptOffer('${m.id}')" style="background:#00ff99;color:black;">✔ Accepter</button>

<button class="offer-btn" onclick="rejectOffer('${m.id}')" style="background:#ff3b3b;color:white;">❌ Refuser</button>

</div>

</div>

`;

}

else {

div.innerHTML = `

<div style="display:flex;align-items:center;gap:8px;">

<img src="${avatar}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;">

<span>${escapeHTML(m.message || "")}</span>

</div>

`;

}

return div;

}



async function load(){

let { data, error } = await client

.from("messages")

.select("*")

.or(`and(sender.eq.${user},receiver.eq.${friend}),and(sender.eq.${friend},receiver.eq.${user})`)

.order("created_at", { ascending: true });



if(error) return;



messagesBox.innerHTML = "";

let fragment = document.createDocumentFragment();



(data || []).forEach(m => {

fragment.appendChild(createMessageElement(m));

});



messagesBox.appendChild(fragment);

messagesBox.scrollTop = messagesBox.scrollHeight;

}



function escapeHTML(text){

let d = document.createElement("div");

d.textContent = text;

return d.innerHTML;

}



async function send(){

let input = document.getElementById("input");

let msg = input.value.trim();

if(!msg) return;

input.value = "";

await client.from("messages").insert([{ sender: user, receiver: friend, message: msg }]);

}



async function offerPrice(){

let price = prompt("Montant de l'offre ?");

if(!price || isNaN(price)) return;

await client.from("messages").insert([{ sender: user, receiver: friend, offer_price: Number(price), offer_status: "pending" }]);

}



async function acceptOffer(id){

await client.from("messages").update({ offer_status: "accepted" }).eq("id", id);

}



async function rejectOffer(id){

await client.from("messages").update({ offer_status: "rejected" }).eq("id", id);

}



document.getElementById("input").addEventListener("keydown", e => {

if(e.key === "Enter") send();

});



// Gestion propre et instantanée du micro

let isRecording = false;

recordBtn.onclick = async () => {

if (!isRecording) {

try {

const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');

mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

audioChunks = [];



mediaRecorder.ondataavailable = e => {

if (e.data && e.data.size > 0) audioChunks.push(e.data);

};



mediaRecorder.onstop = async () => {

stream.getTracks().forEach(track => track.stop());

const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });


const reader = new FileReader();

reader.readAsDataURL(audioBlob);

reader.onloadend = async () => {

await client.from("messages").insert([{

sender: user,

receiver: friend,

voice: reader.result

}]);

};

};



mediaRecorder.start();

isRecording = true;

recordBtn.innerText = "⏹";

recordBtn.classList.add("recording");



} catch (err) {

alert("Erreur d'accès au micro.");

console.error(err);

}

} else {

if (mediaRecorder && mediaRecorder.state === "recording") {

mediaRecorder.stop();

}

isRecording = false;

recordBtn.innerText = "🎤";

recordBtn.classList.remove("recording");

}

};



// Temps réel Supabase instantané sans rechargement complet de page

client

.channel('chat_room_' + [user, friend].sort().join('_'))

.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {

let m = payload.new;

// Vérifier si le message concerne bien la discussion actuelle

if ((m.sender === user && m.receiver === friend) || (m.sender === friend && m.receiver === user)) {

// Éviter les doublons si on est l'expéditeur et qu'on l'a déjà affiché (optionnel, mais ici l'insertion déclenche l'écoute)

messagesBox.appendChild(createMessageElement(m));

messagesBox.scrollTop = messagesBox.scrollHeight;

}

})

.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, payload => {

let m = payload.new;

let existingEl = messagesBox.querySelector(`[data-id="${m.id}"]`);

if (existingEl) {

// Mettre à jour l'affichage de l'offre si son statut change

let statusText = m.offer_status === "accepted" ? "✔ Acceptée" : m.offer_status === "rejected" ? "❌ Refusée" : "⏳ En attente";

let statusEl = existingEl.querySelector(".offer-status-text");

let actionsEl = existingEl.querySelector(".offer-actions");

if (statusEl) statusEl.innerText = statusText;

if (actionsEl && m.offer_status !== "pending") actionsEl.style.display = "none";

}

})

.subscribe();



// Initialisation

(async () => {

await preloadUsers();

await load();

})();

</script>

</body>

</html>
